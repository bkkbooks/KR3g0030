body:
  text: 訟坎下乾上訟生生不絕之謂道六位不居返為游魂離宮八卦以訟為反四天與水違曰訟五行所占六位定吉凶非所背順為正金與水二氣相資父子之謂健與險內外相激家國之義出象故以則斯可驗矣與巽為飛伏諸侯居世元士見應建始戊午至癸亥積筭起癸亥至壬戌周而復始火水入卦五星從位起熒惑畢宿從位降壬午火分氣候三十六天下見水陰陽相背二氣不交物何由生吉凶宗於上九進退見於九四二居中履正得其宜也陰陽升降復歸內象次降天火同人卦
