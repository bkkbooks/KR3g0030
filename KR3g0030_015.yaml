body:
  text: 大過巽下兌上大過陰陽代謝至於游魂繫云精氣為物游魂為變是故知鬼神之情狀互體象乾以金土定吉凶去本末取二五為過之功與坎為飛伏降諸侯立元首元士居應上建丙戌至辛卯積算起辛卯至庚寅周而復始五星從位起熒惑箕宿從位降丁亥陰陽相蕩至極則反反本及末於游魂分氣候三十六陽入陰陰陽交互反歸於本曰歸魂降隨卦
