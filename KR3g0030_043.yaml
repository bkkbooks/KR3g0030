body:
  text: 家人離下巽上家人乾剛俱變文明內外相應陰陽得位居中履正火上見風家人之象間邪存誠嗃嗃得中互體見文明家道明也內平遇坎險象家人難也酌中之義在於六二與離為飛伏建始癸卯至戊申積算起戊申至丁未金土入離巽大夫居世應九五立君位五星從位起太陰箕宿從位降己丑分氣候其數三十六火木分形陰陽得位內外相資二氣相合君君臣臣父父子子兄兄弟弟易曰家人嗃嗃父子嘻嘻治家之道分於此也吉凶之義配五行進退文明運動變化之象九三適陰入震風為雷合曰益次降風雷益卦
