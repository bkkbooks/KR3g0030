body:
  text: 既濟離下坎上既濟二氣無衝陰陽敵體世應分君臣剛柔得位曰既濟與離為飛伏世上見三公應上見宗廟內外陰陽相應坎離相納上下交五行相配吉凶麗乎爻象建丙戌至辛卯卦氣分節氣始丙戌受氣至辛卯成正象考六位分剛柔定吉凶積算起辛卯至庚寅周而復始五星從位起熒惑危宿從位降己亥分氣候二十八坎入兌為積陰二象分俱陰上下反覆卦變革
