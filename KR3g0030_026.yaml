body:
  text: 賁離下艮上賁泰取象上六柔來反剛九二剛上文柔成賁之體止於文明賁者飾也五色不成謂之賁文彩雜也山下有火取象文明火土分象與離為飛伏世立元士六四諸侯在應陰柔居尊文柔當世素尚居高侯王無纍易云賁于丘園束帛戔戔建始辛卯至丙申積算起丙申至乙未周而復始五星從位起鎮星昴宿從位降己卯分氣候二十八土火木分陰陽相應為敵體上九積陽素尚全身遠害貴其正道起於潛至於用九陰陽升降通變隨時離入乾將之大畜次降六二中虛為三連入大畜卦
