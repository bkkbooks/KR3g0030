body:
  text: 明夷離下坤上明夷積陰盪陽六位相傷外順而隔於明處暗不分傷於正道曰明夷五行升降八卦相盪變陽入純陰陰道危陽道安故與震為飛伏傷於明而動乃見志退位入六四諸侯在世元士為應君暗臣明不可止建起六四癸巳至戊戌積筭起戊戌至丁酉周而復始五星從位起太陰奎宿從位降癸丑分氣候三十六地有火明於內暗於外當世出處為眾所疑之所及傷於明易曰三日不食主人有言陰陽進退金水見火氣不相合六位相盪四時運動靜乃復本故曰游魂次降歸魂入師卦
