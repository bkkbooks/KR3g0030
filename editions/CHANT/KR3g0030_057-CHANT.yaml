body:
  text: 兌兌下兌上兌積陰為澤純金用體畜水凝霜陰道同也上六陰生與民為合土木入兌水火應之二陰合體積于西郊衝震入乾氣類陰也配象為羊物類同也與艮為飛伏上六宗廟在世六三三公為應建始乙卯至庚申積筭起庚申至己未周而復始金土入兌宮五星從位起太白參宿從位降丁未土分氣候三十六內卦互體見離巽配火木入金宮分貴賤於強弱吉凶隨爻筭歲月運氣逐休王陰陽升降變初九入初六陽入陰為坎象正體見陽位剛柔分吉凶見也適變內象入坎為困卦
