body:
  text: 比坤下坎上比反本復位陰陽相定六爻交互一氣在也水在地上九五居尊萬民服也比親於物物亦附焉原筮於宗歸之於眾諸侯列土君上崇之奉于宗祧盟契無差邦必昌矣與乾為飛伏歸魂六之三公居世應上六宗廟建始癸卯至戊申積筭起熒惑房宿從位降乙卯分氣候二十八陰道將復以陽為主一陽居尊群陰宗之六爻交分吉凶定矣地道之義妻道同也臣之附君比道成也歸魂復本陰陽相成萬物生也故曰坤生三女巽離兌分長中下以陽求陰乾之巽為長女
