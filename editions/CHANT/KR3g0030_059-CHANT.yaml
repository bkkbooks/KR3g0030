body:
  text: 萃坤下兌上萃金火分氣候土木入兌宮升降陰氣盛剛柔相應合九五定群陰二氣悅而順澤上於地積陰成萃易曰萃者聚吉凶生陽氣合而悅與坤為飛伏六二大夫居世九五至尊見應建始戊寅至癸未積筭起癸未至壬午周而復始土木入坤兌五星從位起熒惑翼宿從位降乙巳分氣候二十八澤下見坤二氣順木土入宮有愛惡陰陽升降陽氣來止於坤象互見艮兌象納艮陰氣強次降澤山咸卦
