body:
  text: 大有乾下離上大有卦復本宮曰大有內象見乾是本位純金用事與坤為飛伏三公臨世應上九為宗廟建戊寅至癸未積筭起癸未土至壬午火周而復始五星從位起太陰軫宿從位降甲辰金土分象三十六候配陰陽升降六位相盪返復其道吉凶度數與乾卦同分六五陰柔為日照于四方象天行健少者為多之所宗六五為尊也易曰火在天上大有陰陽交錯萬物通焉陰退陽伏返本也乾象分盪八卦入大有終也乾生三男次入震宮八卦
