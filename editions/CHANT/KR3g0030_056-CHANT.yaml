body:
  text: 同人離下乾上同人二氣同進健而炎上同途異致性則合也易曰出門同人又誰咎也九二得位居中六三積陰待應易曰先號咷而後笑八卦復位六爻遷次周而復始上下不停生生之義易道祖也天與火明而健陽道正陰氣和也吉凶故象五行昭然與坎為飛伏歸魂立三公為世上九宗廟為應侯建始丁巳至壬戌積筭起壬戌至辛酉周而復始火土入乾離五星從位起鎮星觜宿從位降己亥水分氣候二十八火上見金二氣雖同五行相悖六爻定位吉凶之兆在乎五二得時則順失時則逆陰陽升降歲月分焉爻象相盪內外適變八卦巡迴歸魂復本本靜則象生故適離為兌入少女分八卦於兌象
