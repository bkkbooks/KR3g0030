body:
  text: 復震下坤上復陰極則反陽道行也易云君子道長小人道消又曰七日來復六爻反復之稱易云初九不遠復无秪悔六爻盛卦之體總稱也月一陽為一卦之主與震為飛伏初九元士之世六四諸侯見應建始乙未至庚子積筭起庚子至己亥周而復始土水見候五星從位起歲星張宿從位降庚子分氣候二十八坤上震下動而順是陽來盪陰陰柔反去剛陽復位君子進小人退易云休復元吉陽升陰降變六二入兌象次併臨二陽將進內為悅陰去陽來氣漸隆火之入地澤臨卦
