body:
  text: 屯震下坎上屯內外剛長陰陽升降動而險凡為物之始皆出先難後易今屯則陰陽交爭天地始分萬物萌兆在於動難故曰屯故易曰屯如邅如乘馬班如泣血漣如難定乃通易云女子貞不字十年乃字土木應象見吉凶與震為飛伏世上見大夫應至尊陰陽得位君臣相應可以定難於草昧之世建乙酉至庚寅積筭起庚寅至己丑周而復始五星從位起歲星虛宿從位降庚寅分氣候三十六陽適陰入中女子午相敵見吉凶
