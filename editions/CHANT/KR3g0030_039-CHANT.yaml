body:
  text: 需乾下坎上需雲上於天凝於陰而待於陽故曰需需者待也三陽務上而隔於六四路之險也坤之反覆適陽入陰陰陽交會運動陰雨積而凝滯於陽通乃合也與兌為飛伏游魂立世諸侯應初九元士建始甲辰至己酉積筭起己酉至戊申周而復始金土入乾坎五星從位起歲星氐宿從位降戊申分氣候三十六乾外見坎健而進隘在前也需與飲食爭於坎也陰陽相激勝負有倚反為不速敬終有慶陰陽漸消陽道行行反復其位不妄於陰坎降入歸魂水地比卦坤之歸魂也
