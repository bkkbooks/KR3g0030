body:
  text: 泰乾下坤上泰乾坤二象合為一運天入地交泰萬物生焉小往大來陽長陰危金土二氣交合易云泰者通也通於天地長於品彙陽氣內進陰氣升降升降之道成於泰象與乾為飛伏三公立九三為世上六宗廟為應侯建始丁酉至壬寅積筭起壬寅至辛丑周而復始五星從位起鎮星軫宿從位降甲辰分氣候二十八地下有天陽道浸長不可極極則否成存泰之義在於六五陰居陽位能順於陽陰陽相納二氣相感終於泰道外卦純陰陽來剛柔成于震象降陽升居乾上成大壯
