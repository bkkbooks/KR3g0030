body:
  text: 剝坤下艮上剝柔長剛減天地盈虛體象金為本隨時運變水土用事成剝之義出於上九易云碩果不食君子得輿小人剝廬與艮為飛伏天子治世反應大夫建甲戌至己卯陰陽定候積筭起己卯木至戊寅木周而復始純土配金用事五星從位起鎮星張宿從位降丙子金土分氣三十六易象云山附於地剝君子俟時不可苟變存身避害與時消息春夏始生天氣盛大秋冬嚴殺天氣消滅故當剝道已成陰盛不可逆陽息陰專升降六爻反為游魂盪入晉
