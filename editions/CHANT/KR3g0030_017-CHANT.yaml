body:
  text: 坎坎下坎上坎積陰以陽處中柔順不能履重剛之險故以剋克柔而履險而曰陽是以坎為屬中男分北方之卦也與離為飛伏世立宗廟居於陰位比近九五金於坎道遠於禍害三公居應亦為陰暗成坎之德在於九五九二也建起戊寅至癸未積筭起癸未至壬午周而復始五星從位起太白牛宿從位降戊子歲數運數三十六內外俱坎是重剛之位易曰坎陷也震以陽居初能震動於物能為動主坎以陽居中為重剛之主故以坎為險陽變陰成於險道今以陰變陽止於為節
