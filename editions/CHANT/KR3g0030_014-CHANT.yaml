body:
  text: 井巽下坎上井陰陽通變不可革者井也井道以澄清不竭之象而成於井之德也易云井者德之基又云往來井井見功也改邑不改井德不可渝也與坎為飛伏九五處至尊應用見本象建辛巳至丙戌積筭起丙戌至乙酉周而復始五星從位起歲星尾宿從位降戊戌坎下見風險於前內外相資益於君賢人有位君子不孤傳曰德不孤必有鄰氣候所象定數於二十八天地之數分於人事吉凶之兆定於陰陽陰生陽消陽生陰滅二氣交互萬物生焉震至於井陰陽代位至極則反與巽為終退復於本故曰游魂為大過
