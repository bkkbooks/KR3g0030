body:
  text: 蒙坎下艮上蒙積陽居陰止於坎陷養純正素居中得位易云山下出泉蒙二象摽正天下通也擊暗釋疑陽道行也內實外正暗得明陰附於陽稚道亨也故曰蒙養正與艮為飛伏諸侯立世元士為應建始壬子至丁巳積筭起丁巳至丙辰周而復始火土入艮坎五星從位起太陰胃宿從位降丙戌土分氣候三十六山下見水畜聚居中分流萬派六位不居吉凶適變水土分也陰陽進退歲時物也六五陽中積陰入巽見陰中陽二氣相盪不可盈望次降入風水渙卦
