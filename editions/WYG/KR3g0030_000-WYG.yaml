body:
  text: 京氏易傳術數類四占卜之屬提要臣等謹案京氏易傳三卷漢京房撰吳陸績註房本姓李吹律自定為京氏字君明東郡頓邱人受易于焦延夀元帝時以言災異得幸為石顯等所嫉出為魏郡太守卒以譖誅事迹具漢書本傳績有易注已著録房所著有易傳三卷周易章句十巻周易錯卦十巻周易妖占十二卷周易占事十二巻周易守株三巻周易飛候九卷又六巻周易飛候六日七分八巻周易四時候四卷周易混沌四卷周易委化四巻周易逆刺占灾異十二巻易傳積算法襍占條例一卷今惟易傳存考漢志作十一篇文獻通考作四巻均與此本不同然漢志所載古書卷帙多與今互異不但此編通考所謂四巻者以晁陳二家書目考之盖以雜占條例一卷合于易傳三巻共為四卷亦不足疑惟晁氏以易傳為即錯卦雜占條例為即逆占灾異則未免臆斷無據耳其書雖以易傳為名而絶不詮釋經文亦絶不附合易義上巻中卷以八卦分八宫每宫一純卦統七變卦而註其世應飛伏游魂歸魂諸例下卷首論聖人作易揲蓍布卦次論納甲法次論二十四氣候配卦與夫天地人鬼四易父母兄弟妻子官鬼等爻龍德虎形天官地官與五行生死所寓之類盖後來錢卜之法實出於此故項安世謂以京易考之世所傳火珠林即其遺法以三錢擲之兩背一面為坼兩面一背為單俱面為交俱背為重此後人務趋㨗徑以為卜肆之便而本意尚可考其所異者不以交重為占自以世為占故其占止于六十四爻而不能盡三百八十四爻之變張行成亦謂衛元嵩元包其法合于火珠林火珠林之用祖于京房陸德明經典釋文乃於周易六十四卦之下悉註某宫一世二世三世四世游魂歸魂諸名引而附合於經義誤之甚矣乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書京氏易傳卷上漢京房撰乾下乾上乾純陽用事象配天屬金與坤為飛伏居世壬戌土癸酉金易云用九見羣龍无首吉純陽用九之徳九三三公為應肖乾乾夕惕之憂甲壬配外内二象乾為天地之首分甲壬入乾位積算起己巳火至戊辰土周而復始吉凶之兆積年起月積日起時積時起卦入本宫五星從位起鎮星土星入西方麗西北居壬戌為伏位參宿從位起壬戌壬戌
