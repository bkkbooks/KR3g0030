  - {type: variant, offset: 4, length: 3, content: 守陸績, WYG: 白太白在西居金位井宿從位入辛丑辛丑入土元上臨母也建午起坤宫初六爻易云履霜堅冰至建亥龍戰于野戍亥是乾之位乾伏本位必戰積隂之地猶盛故戰配於人事為腹為母坤順容於物於類為馬易云行地無疆此釋一爻配坤象本體是乾巽今賛一爻起隂假坤象言之内巽為風乾為天天下有風行君子以號令告四方巽入也風入於坤皆動也故知天下有風動其物也天風氣象三十六候三十六候節氣降大風象木入金為始金納木也隂不能制於陽附於金柅易之柔道牽也五行升降以時消息隂盪降入遯天山遯卦艮下乾上遯隂爻用事隂盪陽遯金土見象山在天下為遯遯退也隂來陽退也小人君子汚隆契斯義也易云遯世無悶與艮為飛伏大夫居世建辛未為月丙午火丙寅木六二得應與君位遇建焉臣事君全身逺害遯俟時也建辛未至丙子隂陽遯去終而伏位從六月至十一月也積算起丙子至乙亥周而復始火土同宫天與山遯陽消隂長無専於敗繫云能消息者必専者敗五星從位起太隂鬼宿入位降丙辰丙午臨元土配於人事為背為手艮為背手於類為狗為山石内外升降隂陽分數二十八候分隂陽進退土入金為緩積陽為天積隂為地山所地髙峻逼通於天是隂長陽消降入否隂逼陽去入天地否卦坤下乾上否内象隂長純用隂事天氣上騰地氣下降二象分離萬物不交也小人道長君子道消隂小人陽君子易云否之匪人與坤為飛伏三公居世乙卯木甲辰土上九宗廟為應君子以俟時小人為灾乙卯泰來建壬申至丁丑隂氣浸長七月立秋至十二月大寒積算起丁丑至丙子周而復始金丑土同宫吉凶見矣五星從位起嵗星木星入卦用事柳宿從位降乙卯乙卯臨三公氣分氣候三十六六六三十六積算吉凶隂陽升降陽道消鑠隂氣凝結君臣父子各不迨及隂盪陽來道行矣易曰其亡其亡繫于苞桑苞桑則叢桑也天地清濁隂薄音搏陽消天地盈虚與時消息危難之世勢不可久五位既分四時行矣君子當危難世獨志難不可久立特處不改其操將及泰來上九云否終則傾何可長也否極則泰來隂長降入於觀九四被隂逼入觀卦坤下巽上觀内象隂道已成威權在臣雖大觀在上而隂道浸長與巽為飛伏諸候臨世辛未土壬午火反應元士而奉九五君位也易云觀國之光利用賔于王臣道出於六四爻也建癸酉至戊寅隂陽交伏秋分至立春積算起戊寅至丁丑周而復始用金為首金土火互為體五星從位起熒惑火星入卦用事吉凶星宿從位降辛未星宿入諸侯宫木星同位土木分氣二十八積算分配六位吉凶爻定數隂陽升降定吉凶成敗取六四至于九五成卦之終也易云觀我生我生即道也又云風行地上君子之徳風小人之徳草也列象分爻以定隂陽進退之道吉凶見矣地上見巽積隂凝盛降入于剥九五退隂入剥卦坤下艮上剥柔長剛減天地盈虚建戌至建亥體象金為本隨時運變水土用事成剥之義出於上九易云碩果不食君子得輿小人剥廬君子全得剥道安其位小人終不可安也與艮為飛伏丙子水壬申金天子治世反應大夫建甲戌至己卯隂陽定候寒露至春分積算起己卯木至戊寅木周而復始吉凶之兆見于有象純土配金用事五星從位起鎮星土星入卦張宿從位降丙子張宿入天子宫金土分氣三十六積算六位起吉凶天地盈虚氣候易象云山附於地剥君子俟時不可茍變存身避害與時消息春夏始生天氣盛大秋冬嚴殺天氣消滅故當剥道已成隂盛不可逆陽息隂専升降六爻反為游魂盪入晉積隂反入晉卦坤下離上晉隂陽返復進退不居精粹氣純是為游魂為隂極剥盡陽道不可盡滅故返陽道道不復本位為歸魂例入卦金方以火土運用事與離為飛伏己酉金丙戌土諸侯居世反應元士建己卯至甲申隂陽繼候春分立秋積算起甲申金至癸未土周而復始游魂取象配於正位吉凶同矣五星從位起太白卦配金星入用翼宿從位降己酉金翼宿北方入晉卦行事二象分候二十八運配金土積算氣候無差於晷刻吉凶列陳象在其中矣天地運轉氣在其中矣乾道變化萬物通矣乾分八卦至大有復卦六爻交通至於六卦隂陽相資相返相尅相生至游魂復歸本位為大有故曰火在天上大有為歸魂卦定吉凶配人事五行象乾為指歸地凢八卦分為八宫每宫八卦八八六十四卦定吉凶配人事天地山澤草木日月昆蟲包含氣候足矣乾下離上大有卦復本宫曰大有内象見乾是本位八卦本從乾宫起至大有為歸魂純金用事與坤為飛伏甲辰土乙卯木三公臨世應上九為宗廟建戊寅至癸未立春正月至大暑時也積算起癸未土至壬午火周而復始吉凶與乾卦同用五星從位起太隂太隂水星入卦用事軫宿從位降甲辰二十八宿分軫星入大有卦用事行度吉凶可見金土分象三十六候配隂陽升降六位相盪返復其道復歸本位也吉凶度數與乾卦同分六五隂柔為日照于四方象天行健六龍御天少者為多之所宗六五為尊也柔處尊位以柔履剛以隂處陽能柔順於物萬物歸附故曰照于四方易曰火在天上大有離為火為日故曰大有隂陽交錯萬物通焉隂退陽伏返本也乾象分盪八卦入大有終也乾生三男次入震宫八卦乾生三男坤生三女陽以陽隂以隂求竒耦定數于象也震下震上震分隂陽交互用事屬於木徳取象為雷出自東方震有聲故曰雷雷能警於萬物為發生之始故取東也為動之主為生之本易繫云帝出乎震安為動主靜為躁君與巽為飛伏庚戌土辛卯木宗廟處上六隂為陽之主震動動須由隂陽交互震動也運數入丙子至辛巳大雪至小滿積算起辛巳至庚辰土宫配吉凶周而復始吉凶配木官以土用事五星從位起嵗星木星入卦用事角宿從位降庚戌土庚戌入震用事臨上六爻庚戌土位為元首内外木土二象俱震易曰震驚百里又云畏隣戒也震為雷聲驚于百里春發秋收順天行也取象定吉凶取象為陽配爻屬隂故曰隂陽交錯而為震氣候分數三十六定吉凶於頃刻毫釐之末無不通也無不備也定隂陽數考人之休咎起于積算終于六位也隂陽交互陽為隂隂為陽隂陽二氣盪而為象故初九三隂為豫入豫卦坤下震上豫卦配火水木以為陽用事易云利建侯行師又云天地以順動故日月不過四時不忒坤順震動聖人以順動則刑罰清而民服與坤為飛伏乙未土庚子水世立元士為地易奉九四為正正建丁丑至壬午大寒芒種積算起壬午至辛巳以六爻定吉凶周而復始火土算休咎五星從位起熒惑熒惑火星入卦用事亢宿從位降乙未土亢宿配乙未土上木下見土内順外動故為悦豫時有屯夷事非一揆爻象適時有凶有吉人之生世亦復如斯或逢治世或逢亂時出處存亡其道皆繫易云大矣哉隂陽升降分數二十八極大小之數以定吉凶之道積算壬午入乙未推吉凶豫以陽適隂為内順成卦之義在於九四一爻以陽盪隂君子之道變之於解豫卦以隂入陽成九四之徳變入解卦陽入隂成解之徳坎下震上解隂陽積氣聚散以時内險外動必散易云解者散也解也品彚甲拆雷雨交作震雷坎雨積氣運動天地剖判成卦之義在於九二與坎為飛伏戊辰土庚寅木立大夫於世為人而六五降應委權命於庶品建戊寅至癸未立春大暑推吉凶於隂陽定運數於嵗時積算起癸未至壬午周而復始土火入數起宫五星從位起鎮星鎮星土位氐宿從位降戊辰氐宿入戊辰木下見水動而險隂陽會散萬物通焉升降屬陽盪隂以陽為尊尊者髙而卑者低變六三為九三恒卦分氣候定數極位於三十六金水入數合卦成數定日月時變坎入巽居内象為雷風運動鼔吹萬物謂之恒入恒卦巽下震上恒久於其道立於天地雷與風行隂陽相得尊卑定矣號令發而萬物生焉萬物得其道也生者道一作進也雷風行而四方齊也齊者整肅與巽為飛伏辛酉金庚辰土三公治世應於上六宗廟宗廟爻建己卯至甲申春分立秋金木起度數積算起甲申至癸未周而復始金木入宫五星從位起太白太白金星入卦用事房宿從位降辛酉房宿入卦立秋用上下二象見木分隂陽於内外内巽隂外震陽氣候分數三十八金木入卦分節候九三至於陽屯之位不順所履無定其位恒者常也而九三以陽居位立于隂陽交互之上是知不久為缺所然缺易云不恒其徳或承之羞隂陽升降反於隂君道漸進臣下爭權運及於升次降入升卦巽下坤上升陽升隂而隂道凝盛未可便進漸之曰升升者進也卦雖隂而取象於陽故曰以陽用事内巽隂木陽也與坤為飛伏癸丑土庚午火諸侯在世元士為應侯建庚辰至乙酉清明秋分積算起乙酉至甲申周而復始金水合木官見象定吉凶五星從位起太隂太隂水星入卦取象心宿入位降癸丑心宿入卦配土位土下見木内外俱順動隂陽而長嵗時人事配吉凶發乎動占嵗時人事吉凶之兆見乎動易繫云吉凶悔吝生乎動氣候配象數位三十六分隂爻數分陽爻數自下升髙以至於極至極而反以修善道而成其體合抱之木始於毫末隂道革入陽為坎水與風見井入井卦巽下坎上井隂陽通變不可革者井也井道以澄清不竭之象而成於井之徳也易云井者徳之基又云往來井井見功也改邑不改井徳不可渝也井道以澄清見用為功也井象徳不可渝變也與坎為飛伏戊戌土庚申金九五處至尊應用見本象建辛巳至丙戌小滿寒露積算起丙戌至乙酉周而復始火土入卦起算數五星從位起嵗星木星入卦東方用事尾宿從位降戊戌尾宿配戊戌入卦宫坎下見風險於前内外相資益於君井以徳立君正民信徳以其道也賢人有位君子不孤傳曰徳不孤必有隣六爻各處其務反覆隂陽變化各得其道也氣候所象定數於二十八爻配隂陽分人事吉凶具見矣天地之數分於人事近取諸身逺取諸物吉凶之兆定於隂陽隂生陽消陽生隂滅二氣交互萬物生焉震至於井隂陽代位至極則反與巽為終退復於本故曰游魂為大過降入大過卦巽下兊上大過隂陽代謝至於游魂繫云精氣為物游魂為變是故知鬼神之情狀互體象乾以金土定吉凶去本末取二五為過之功大者相過與坎為飛伏丁亥水戊申金降諸侯立元首元士居應上建丙戌至辛卯起元氣從丙戌至辛卯為卦建建者則所生之位今立建起至辛卯取隂陽至位極處也寒露至秋分積算起辛卯至庚寅周而復始土木入卦用事五星從位起熒惑熒惑火星入卦箕宿從位降丁亥箕宿配丁亥水合卦宫也隂陽相盪至極則反反本及末於游魂分氣候三十六六爻極隂陽之數三十六五行分配定吉凶於積算陽入隂隂陽交互反歸於本曰歸魂降隨卦入澤雷隨卦震下兌上隨震象復本曰隨内見震也内象見震曰本從震起至隨為歸魂純木用事與巽為飛伏庚辰土辛酉金世立三公應宗廟建乙酉至庚寅秋分立春積算起庚寅至己丑土木入卦氣算周而復始吉凶定於算數為凖五星從位起鎮星鎮星上入卦用事計都從位降度辰計都配庚辰土入卦分吉凶氣候分數二十八定數於六位六位雖殊吉凶象震進退隨時各處其位無差晷刻内外二象恱而動隨附於物係失在於六爻易云係丈夫失小子乂云係小子失丈夫此之謂也吉凶定於起算之端進退見乎隨時之義金木交刑水火相敵休廢於時吉凶生焉震以一君二民動得其宜震一陽二隂陽君隂民得其正也本於乾而生乎震故曰長男隂陽升降為八卦至隨為定體資於始而成乎終坎降中男而曰坎互陽爻居中為坎卦坎下坎上坎積隂以陽處中柔順不能履重剛之險故以剛克柔而履險而曰陽是以坎為屬中男分北方之卦也與離為飛伏戊子水己巳火世立宗廟居於隂位比近九五全於坎道逺於禍害三公居應亦為隂暗成坎之徳在於九五九二也内外居坎陽處中而為坎主純隂得陽為明臣得君而安其居也一作君得臣而顯其道也建起戊寅至癸未大暑大雪積算起癸未至壬午周而復始金水入卦本同宫氣候起算時日嵗月吉凶五星從位起太白太白金星入水宫牛宿從位降戊子二十八宿從位八卦周而復始嵗候運數三十六配六位分隂陽三百五十六餘日四分之一分五行配運氣吉凶見矣内外俱坎是重剛之位易曰坎陷也坎水能深陷于物處坎之險不可不習故曰習坎便習之習後可得履于險而不陷没者不以剛履柔不能成坎之道也震以陽居初能震動於物能為動主乾生震一陽居於初震為長男坎以陽居中為重剛之主故以坎為險陽變隂成於險道今以隂變陽止於為節次入于節卦兊下坎上節水居澤上澤能積水陽止於隂故為節節者止也陽盪隂而積實居中恱内而險於前隂陽進退金水交運與兊為飛伏丁巳火戊寅木元士立元首見應諸侯金火受其氣納到内建起甲申至己丑為本身節氣立秋大寒積算起己丑至戊子周而復始金水坎火運入卦雜定吉凶五星從位起太隂太隂屬水入卦用事女宿從位降丁巳配象入積算金上見水本位相資二氣交爭失節則嗟易云不節若則嗟若分氣候二十八積算起數二十八中男入兌少女分盪入隂中位見陽升降見長男次入水雷屯是則節險入陽盪九二爻體歸於陽次入屯卦震下坎上屯内外剛長隂陽升降動而險凡為物之始皆出先難後易今屯則隂陽交爭天地始分萬物萌兆在於動難故曰屯水在雷上如雲雷交作天地草昧經綸之始無出於此也故易曰屯如邅如乘馬班如泣血漣如屯難之際盤桓不進之貌難定乃通易云女子貞不字十年乃字字愛也時通則道亨合正匹也土木應象見吉凶與震為飛伏庚寅木戊辰土世上見大夫應至尊隂陽得位君臣相應可以定難於草昧之世建乙酉至庚寅秋分立春積算起庚寅至己丑周而復始土木配本宫起積算五星從位起嵗星木星入卦虛宿從位降庚寅虚宿入六二庚寅位分氣候三十六定吉凶之數陽適隂入中女子午相敵見吉凶動入離象見既濟離下坎上既濟二氣無衝隂陽敵體世應分君臣剛柔得位曰既濟離坎分子午水上火下性相交敵不間隔是曰既濟也與離為飛伏己亥水戊午火世上見三公應上見宗廟内外隂陽相應坎離相約上下交坎水潤下離火炎上二氣相交為既濟五行相配吉凶麗乎爻象吉凶之兆見乎爻象建丙戌至辛卯寒露春分卦氣分節氣始丙戌受氣至辛卯成正象考六位分剛柔定吉凶積算起辛卯至庚寅周而復始土木見運入卦五星從位起熒惑熒惑火星入卦危宿從位降己亥危宿入己亥分氣候二十八定六爻之類考吉凶之兆坎入兊為積隂二象分俱隂上下反覆卦變革坎入革六四盪之入陽變體為隂也離下兊上革二隂雖交志不相合體積隂柔爻象剛健可以革變兊上離下中虛務上下積隂變改之兆成物之體故曰革易云君子豹變小人革面與兊為飛伏丁亥水戊申金諸侯當世見元士九五六二為履正位天地革變人事隨而更也更者變也建始丁亥至壬辰小雪清明水土配位土水入卦積算起壬辰至辛卯周而復始五星從位起鎮星土星入卦室宿從位降丁亥二十八宿室宿入卦革丁亥土分氣候三十六其數起元首分隂陽之象數吉凶生矣上金下火金積水而為器器能盛納於物火變生而為熟生熟稟氣於隂陽革之於物物亦化焉五行類五色五色類萬物禀和氣氣即順剛即逆逆即反反即敗易云己日乃孚孚猶信也隂陽更始動以見吉凶震主動也動以柔當位剛㑹之光大革變於豐外卦兊入震為豐卦離下震上豐雷火交動剛柔散氣積則暗動乃明易云豐其屋蔀其家闚其户閴其無人三嵗不覿乃凶上六積暗而動凶之於上反下見隂之兆火木分象配於積隂與震為飛伏庚申金戊戌土隂處至尊為世大夫見應君臣相暗世則可知臣强君弱為亂世之始建生戊子至癸巳大雪小滿雷與火震動曰豐宜日中夏至積隂生豐當正應吉凶見矣日中也積算起癸巳至壬辰周而復始火土起算五星從位起太白太白金星入卦壁宿從位降庚申壁宿入坎至豐庚申入土分氣候二十八積算定六位起數二十八上木下火氣稟純陽隂生於内陽氣雜正性潰亂極乃反為游魂入積隂震入坤也隂陽升降反歸於本變體於有無吉凶之兆或見於有或見於無隂陽之體不可執一為定象於八卦陽盪隂隂盪陽二氣相感而成體或隠或顯故繫云一隂一陽之謂道一者道也外卦震降隂入明夷次入明夷卦離下坤上明夷積隂盪陽六位相傷外順而隔於明處暗不分一作明傷於正道曰明夷夷者傷也五行升降八卦相盪變陽入純隂春夏之秋冬也隂道危陽道安故與震為飛伏癸丑土庚午火傷於明而動乃見志震動也退位入六四諸侯在世元士為應君暗臣明不可止箕子與紂也建起六四癸巳至戊戌游魂及六四爻數起小滿至寒露積算起戊戌至丁酉周而復始土金入卦起算數五星從位起太隂太隂水星入卦奎宿從位降癸丑奎宿入明夷配六四癸丑土上分氣候三十六三十六數入卦起算推吉凶地有火明於内暗於外當世出處為衆疑之所及反傷於明易曰三日不食主人有言隂陽進退金水見火氣不相合六位相盪四時運動靜乃復本故曰游魂以本宫八卦相盪六位推遷也次降歸魂入師卦坎下坤上師變離入隂傷於正道復本歸坎陽在其中矣内卦坎為本宫處下卦之中為隂之主利於行師易云師者衆也衆隂而宗於一陽得其貞正也與離為飛伏離入坎也隂陽相薄剛柔遷位戊午火己亥水世主三公應為宗廟建始壬辰至丁酉清明秋分積算起丁酉至丙申周而復始金火入卦起算五星從位起嵗星嵗星木入卦婁宿從位降戊午婁宿入坎卦歸魂六三爻分氣候二十八起算入卦吉凶地下有水復本位六五居隂處陽位九二貞正能為衆之主不潰於衆易云師貞丈人吉入卦始於坎隂陽相盪反至於極則歸本坎中男陽居九二稱中男升降得失吉凶悔吝䇿於六爻六爻之設出於蓍蓍之得象而卦生積算起於五行五行正則吉極則凶吉凶之象顯於天地人事日月嵗時坎之變於艮艮為少男少男處卦之末為極也震一陽居初爻坎二陽處中艮三陽處卦之末故曰陽極為少男又云止也次入艮卦艮下艮上艮乾分三陽為長中少至艮為少男本體屬陽陽極則止反生隂象易云艮止也於人為手為背取象為山為石為門為狗上艮下艮二象土木分氣候與兊為飛伏丙寅木丁未土為少男取少女相配世上見宗廟三公為應隂陽遷次長幼分形乾三生男將至艮極少長分形長中分之為建也庚寅至乙未立春大暑隂長陽極升降六位進退順時消息盈虚積算起庚寅至己丑周而復始木土入卦五星從位起熒惑熒惑火星入卦胃宿從位降丙寅胃宿入卦分位分數位三十六配位六卦分吉凶金木相敵升降以時艮止於物背於物易云時止則止時行則行剛極陽反隂長積氣止於九三初六變陽取其虚中文明在内成於賁次降入賁卦離下艮上賁泰取象上六柔來反剛九二剛上文柔成賁之體止於文明賁者飾也五色不成謂之賁文彩雜也山下有火取象文明火土分象與離為飛伏己卯木丙辰土世立元士六四諸侯在應隂柔居尊文柔當世素尚居髙侯王無累易云賁于丘園束帛戔戔建始辛卯至丙申春分立秋積算起丙申至乙未周而復始金土入卦起算五星從位起鎮星鎮星入卦昴宿從位降己卯昴宿配賁卦初九陽位起算分氣候二十八起六位五行算吉凶土火木分隂陽相應為敵體上九積陽素尚全身逺害貴其正道起於潛至於用九假乾初上為喻也隂陽升降通變隨時離入乾將之大畜次降六二中虚為三連入大畜卦隂消陽長乾下艮上大畜陽長隂消積氣凝盛外止内健二隂猶盛成于畜義易云既雨既處畜消時行陽未可進取於下卦全其健道君子以時順其吉凶與乾為飛伏甲寅木丙午火建始壬辰至丁酉清明秋分積算起丁酉至丙申周而復始金土入卦分吉凶起算五星從位起太白太白金星入卦推吉凶畢宿從位降甲寅畢宿入大畜九二甲寅上九二大夫應世應六五為至尊隂陽相應以柔居尊闕為畜之主分氣候二十八極隂陽之數定吉凶之兆山下有乾金土相資陽進隂止積雨潤下畜道光也乾象内進君道行也吉凶升降隂陽得位二氣相應陽上薄隂隂道凝結上於陽長為雨反下九居髙位極於畜道反陽為隂入于兊象六三應上九上有陽九反應六三成于損道次降損卦乾入兊九三之變六二兊下艮上損澤在山下卑險於山山髙處上損澤益山成髙之義在於六三在臣之道奉君立誠易云損下益上乾九三變六三隂柔益上九臣奉君之義與兊為飛伏丁丑土丙申金三公居世宗廟為應六三上九建始癸巳至戊戌小滿寒露積算起戊戌至丁酉周而復始土火入官起積算五星從位起太隂太隂水星入卦用事觜宿從位降丁丑二十八宿配觜宿入損卦六三爻起算嵗月日時土星入卦配吉凶隂陽相盪位不居土金入損卦起算隂陽相生六位變動不居也六爻有吉凶四時變更不可執一以為規六爻吉凶隨時更變或春或夏或秋或冬嵗時運動分氣候二十八二十八起數算吉凶入卦隂陽升降次艮入離見睽之象損益六爻剛長隂次入火澤睽卦兊下離上睽火澤二象氣運一作轉非合隂消陽長取象何比惟陽是從隂陽動靜剛柔分焉先睽後合其消通也文明上照幽暗分矣兊處下為積隂暗之象也離在上為明照于下易云見豕負塗載鬼一車先張之弧後說之弧往遇雨則吉羣疑亡也先疑暗也後說明也與離為飛伏己酉金丙戌土諸侯立九四為世初元士為應建始甲午至己亥芒種小雪積算起己亥至戊戌水土入卦五星從位起嵗星嵗木星入卦參宿從位降己酉二十八宿配參宿入卦己酉土分氣候三十六起數積算金火二運合土宫配吉凶於嵗時六五隂柔處文明九二四得立權臣隂陽相盪六位逆遷變離入乾健於外象坎入履隂陽推遷變化六爻吉凶之兆著于要之爻如臣事君近多憂也次降入天澤履卦兊下乾上天下有澤曰履履者禮也得位吉失位凶當履之時素尚吉易云視履考祥其旋元吉與乾為飛伏壬申金丙子水六丙屬八卦艮六丙也九五得位為世身九二大夫合應象建始乙未至庚子大暑大雪積算起己亥至庚子金水入卦配六位算吉凶五星從位起熒惑熒惑火星入卦井宿從位降壬申二十八宿入卦井宿入壬申分氣候金火入卦起於極數二十八二十八數起丙辰推吉凶陽多隂少宗少為貴得其所履則貴失其所履則賤易云眇能視跛能履此履非其位六三也吉凶取此文為凖六位推遷積欠起算數休王相破資益可定吉凶也升降反位歸復止於六四入隂為游魂中孚卦次入中孚卦兊下巽上中孚隂陽變動六位周匝反及游魂之卦金木合上運入卦象互體見艮止於信義中孚信也與乾為飛伏辛未土壬午火艮道革變升降各稟正性六四諸侯立世應初九元士九五履信九二反應氣候相合内外相敵隂勝陽陽勝隂剛柔相薄六爻反應柔順相合吉凶見矣建始庚子至乙巳大雪小滿積算起乙巳至甲辰周而復始火土入卦起積算五星從位起鎮星鎮星土星鬼宿從位降辛未二十八宿配鬼宿入卦推吉凶分氣候三十六配卦算吉凶之位風與澤二氣相合巽而說信及於物物亦一作必順焉易云信及豚魚豚魚幽微之物信尚及之何况於人乎兊入艮六三入陽内二陽歸隂隂陽交互復本曰歸魂次降歸魂風山漸卦内見艮艮下巽上漸隂陽升降復本曰歸魂之象巽下見艮隂長陽消柔道將進艮變八卦終於漸漸終降純隂入坤分長女三隂之兆也柔道行也與兊為飛伏丙申金丁丑土九三三公居世宗廟為應建始己亥至甲辰小雪清明積算起甲辰至癸卯周而復始土木見運入卦算吉凶五星從位起太白太白西方之卦定吉凶柳宿從位降丙申二十八宿柳宿入卦定吉凶分氣候二十八定數配吉凶入卦起算上木下土風入艮象漸退之象也互體見離主中文明九五𫝊位得進道明也九五處互體卦之上進文明也六二隂柔得位應至尊易云鴻漸于磐飲食衎衎賢人進位也隂陽升降八卦將盡六十四爻隂陽相雜順道進退次于時也少男之位分於八卦終極陽道也陽極則隂生柔道進也降入坤宫八卦陽卦三十二宫為陽乾震坎艮也京氏易𫝊巻上欽定四庫全書京氏易傳卷中漢京房撰坤下坤上坤純隂用事象配地屬土柔道光也隂凝感與乾相納臣奉君也易云黄裳元吉六二内卦隂處中臣道正也與乾為飛伏癸酉金壬戌土宗廟居世三公為應未免龍戰之灾無成有終隂臣陽君臣不敢為物之始陽唱隂和君命臣終其事也初六起履霜至於堅冰隂雖柔順氣亦堅剛為無邪氣也建始甲午至己亥芒種小滿積算起己亥至戊戌周而復始純土用事入積算定吉凶五星從位起太隂太隂水星入卦西南方之卦鎮星入卦配坤西南星宿從位降癸酉金二十八宿八卦星宿降坤上六癸酉金分氣候三十六起積為數三十六隂中有陽氣積萬象故曰隂中隂隂陽二氣天地相接人事吉凶見乎其象六位適變八卦分焉六位變動八卦顯著隂雖虚納于陽位稱實六五六三之類也升降反復不能久處千變萬化故稱乎易易者變也隂極則陽來隂消則陽長衰則退盛則戰易云上六龍戰于野其血𤣥黄陽屬乾配西北積隂之地隂盛故戰乾坤倂處天地之氣雜稱𤣥黄也陽來盪隂坤内卦初六適變入陽曰震隂盛陽微漸來之義故稱復次降陽入地雷復卦震下坤上復隂極則反陽道行一作正也易云君子道長小人道消又曰七日來復七日陽之稱也七九稱陽之數也謂坤上六隂極陽戰之地隂雖不能勝陽然正當盛陽不可輕犯六陽涉六隂反下七爻在初故稱七日日亦陽也六爻反復之稱}
