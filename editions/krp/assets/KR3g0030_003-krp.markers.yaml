  - {type: variant, offset: 9, length: 5, content: 兵部侍郎范, WYG: 積算起甲辰至癸卯周而復始金木分乾兊入坤象入坤宫起積算五星從位起太隂太隂水星入卦起算亢宿從位降丁酉二十八宿配亢宿入夬卦丁酉金上起分氣候二十八積算起宫二十八入卦甲辰還丁酉金上定吉凶易云澤上於天夬揚于王庭柔道消消不可極反於游魂九四柔來文剛隂道存也隂之道不可終否剛柔相濟日月明矣天地定位人事通也凡卦隂極陽生陽極隂生生生之義不絶之貌日月循環天地交泰隂陽相盪六位交分萬物生焉故曰雷動風行山澤通氣人之運動體斯合矣人禀五常三焦九竅風火逓相兼濟以一位虧四體嬴焉隂陽升降反復道也次降入游魂水天需卦乾下坎上需雲上於天凝於隂而待於陽故曰需需者待也三陽務上而隔於六四路之險也外卦坎水為險亦隂稱血也坤之反覆適陽入隂夬卦九四入需卦成六四隂之位也隂陽交㑹運動隂雨積而凝滯於陽通乃合也羣陽務上一隂報之故凝滯雨乃合與兊為飛伏戊申金丁亥水游魂立世諸侯應初九元士建始甲辰至己酉清明秋分積算起己酉至戊申周而復始金土入乾坎積算起宫定吉凶五星從位起嵗星嵗星木星入卦氐宿從位降戊申二十八宿降氐宿入坤宫游魂卦六四戊申金上起積算吉凶分氣候三十六定吉凶總三十六位起算乾外見坎健而進險在前也需於飲食爭於坎也隂陽相激勝負有倚反為不速敬終有慶隂陽漸消陽道行行反復其位不妄於隂坎降入歸魂水地比卦坤之歸魂也坤下坎上比反本復位隂陽相定六爻交互一氣在也水在地上九五居尊萬民服也比卦一陽五隂少者為貴衆之所尊者也比親於物物亦附焉原筮於宗歸之於衆諸侯列土君上崇之奉于宗祧盟契無差邦必昌矣與乾為飛伏乙卯木甲辰土歸魂六之三公居世應上六宗廟建始癸卯至戊申春分立秋積算起戊申至丁未周而復始五星從位起熒惑火星入卦房宿從位降乙卯二十八宿配房宿入坤歸魂乙卯木位上分氣候二十八積算起二十八數隂道將復以陽為主一陽居尊羣隂宗之六爻交分吉凶定矣地道之義妻道同也臣之附君比道成也歸魂復本隂陽相成萬物生也故曰坤生三女巽離兊分長中下巽長女離中女兊少女以陽求隂乾之巽為長女巽下巽上巽陽中積隂而巽順本乾象隂來盪成巽巽者順也風從穴入於物號令齊順天地明也内外禀於一隂順於天地道也聲聞於外逺彰柔順隂陽升降柔依剛也本於堅剛隂來又柔東南向明齊肅隂陽與震為飛伏辛卯木庚戌土宗廟居世三公在應上九九三建始辛丑至丙午大寒芒種積算起丙午至乙巳周而復始缺宿火木與二十八宿分虚入巽上九辛卯木上分氣候其數三十六分三十六數入卦起算隂氣起陽陽順於隂隂陽和柔升降得位剛柔分也隂不可盈晷刻傾也初六適變陽來隂退健道行也三陽務進外隂陽也適變於内外未從也次降隂交於陽九為小畜卦初六變初九也乾下巽上小畜易云密雲不雨自我西郊小畜之義在於六四三陽連進於一危也外巽體隂畜道行也巽之初六隂盪陽氣感積隂不能固退復本位三連同往而不可見成於畜義外象明矣一隂劣不能固陽是以往也外巽積隂能固陽道成在上九一爻之法也易云既雨既處也與乾為飛伏甲子水辛丑土初九元士居世六四諸侯在應建始壬寅至丁未立春大暑積算起丁未至丙午周而復始木土入乾巽入宫起算法五星從位起太白金星入卦起算吉凶尾宿從位降甲子二十八宿入卦分尾宿以小畜甲子水上起算分氣候其數二十八分二十八數起宫推算一隂居六四建子入陽宫推其休咎處吉凶剛健立陽爻隂凝在巽體易云輿說輹夫妻反目不義之兆夏至起純隂陽爻位伏藏冬至陽爻動隂氣凝地隂陽升降以柔為剛見中虚文明積氣居内象九二適變入離次降入風火家人卦離下巽上家人乾剛俱變文明内外相應九五應六二爻隂陽得位居中履正火上見風家人之象閑邪存誠嗃嗃得中互體見文明家道明也内平遇坎險象家人難也酌中之義在於六二與離為飛伏己丑土辛亥水建始癸卯至戊申春分立秋積算起戊申至丁未金土入離巽金土入卦同積算大夫居世應九五立君位五星從位起太隂太隂北方入卦起宫推算箕宿從位降己丑二十八宿分箕宿入家人卦在己丑土上分氣候其數三十六三十六起數家人卦推入積算休咎火木分形隂陽得位内外相資二氣相合君君臣臣父父子子兄兄弟弟易曰家人嗃嗃父子嘻嘻治家之道分於此也吉凶之義配五行進退六五進退吉凶於隂陽隂陽得起在於四時運動吉凶見矣分内外矣二象配天地星辰合命定吉凶文明運動變化之象九三適隂入震風為雷合曰益次降風雷益卦震下巽上益天地不交曰否六二隂上柔剛九四下降積隂故為益易曰損上益下雷動風行男下女上震男巽女陽益隂君益於民之象也互見坤坤道柔順又外見艮艮止陽益隂止於陽柔道行也内外順動風雷益四象分明剛柔定矣與震為飛伏庚辰土辛酉金六三三公居世上九宗廟為應建始甲辰至己酉清明秋分積算起己酉至戊申周而復始土金入震巽起積配風雷益卦起宫五星從位起嵗星木星入卦計宿從位降庚辰二十八宿分計宿入風雷益六二庚辰上上分氣候二十八起二十八數積算吉凶周而復始隂陽二木合金土配象四時運轉六位交分休廢旺生吉凶見乎動爻配日月星辰進退運氣升降復當何位金水木火土適變於外陽入隂爻二象健而動屬於天地也天陽震雷亦陽也二氣相激動而健天行也隂陽相盪次降入天