辛亥位上分氣候三十六起宫數三十六宫配卦算吉凶火居木土二氣交合隂陽巽順器具形存金玉堅剛配象隂陽升降六位遞相遷次九三適變以陽入隂見乎坎險鼎九三爻之義隂成坎卦外象内坎外離二氣不交見未濟卦降入水火未濟卦坎下離上未濟隂陽二位各復本體六爻交互異於正象離炎上坎務下二象不合各殊隂陽交納是以異於本象也故取未濟名之世應得位隂陽殊塗九二六五性命不交吉凶列矣坎性離命與坎為飛伏戊午火己亥水六三三公為世應宗廟上九建始辛亥至丙辰小雪清明積算起丙辰至丁卯水土二象入離坎分水土入卦五星從位起太白金星入離宫卦分六爻婁宿從位降戊午火二十八宿分婁宿入未濟九二戊午火位土定吉凶入積算分氣候二十八積算二十八數至吉凶處水火二象坎離相納受性本異立位見隔睽于上下吉凶生也子午之位受刑見害氣不合也隂陽升降入於外卦適離為艮上著於象艮上著離也天地盈虚與時消息其大也次降入山水蒙卦坎下艮上䝉積陽居隂止於坎陷養純正素居中得位易云山下出泉䝉二象摽正天下通也擊暗釋疑陽道行也内實外正暗得明隂附於陽稚道亨也故曰䝉養正與艮為飛伏丙戌土乙酉金諸位立世元士為應六四初六建始壬子至丁巳大雪小滿積算起丁巳至丙辰周而復始火土入艮坎火土二象入卦同算五星從位起太隂水星北方入宫起算胃宿從位降丙戌土二十八宿分胃宿入䝉卦六四丙戌土上分氣候三十六起數二十八從六位推算山下見水畜聚居中分流萬派六位不居吉凶適變水土分也五行入卦算吉凶逐四時行囚廢王吉則王凶則廢隂陽進退嵗時物也六五陽中積隂入巽見隂中陽二氣相盪不可盈望次降入風水渙卦六五變入九五陽中隂入陽中陽適變往于他宫位不出本宫坎下巽上渙水上見木渙然而合渙者散也内外健而順納實居中正互見動而上虚舟行也隂陽二象資而益也風行水上處險非溺也木浮于水也九五履正思順非偪也與巽為飛伏辛巳火己未土九五居尊大夫應九二爻也建始癸丑至戊午大寒芒種積算起戊午至丁巳周而復始火土入坎巽火土二象入坎巽配火宫渙卦起算五星從位起嵗星木星入火宫本象昴宿從位降辛巳火二十八宿分昴宿入渙九五辛巳火位上分氣候其數二十八起算從二十八位上推六爻吉凶嵗月日時為候内卦坎中滿一陽居中積實于内風在外行虛聲外順吉凶之位攷乎四序盛衰之道在乎機要隂陽死于位生于時死于時生于位進退不可詰正盛則衰來正衰則盛來易曰積善之家必有餘慶積不善之家必有餘殃八卦始終六虚反復游魂生巽入乾為天水訟卦坎下乾上訟生生不絶之謂道六位不居返為游魂離宫八卦以訟為反四五至四也天與水違曰訟天道西行水東流其路背也外象乾西北方之卦内坎水正北方之卦其流東也二氣不交曰訟五行所占六位定吉凶非所背順為正金與水二氣相資父子之謂健與險内外相激家國之義出象故以則斯可驗矣與巽為飛伏壬午火辛未土諸侯居世元士見應九四初六建始戊午至癸亥芒種小雪積算起癸亥至壬戌周而復始火水入卦火水二象入離宫配六位積算推日月嵗時五星從位起熒惑火星入火宫同起積算畢宿從位降壬午火二十八宿分畢宿東方宿入離游魂天水訟卦九四壬午火土也分氣候三十六起宫從三十六位算吉凶天下見水隂陽相背二氣不交物何由生吉凶宗於上九進退見於九四二居中履正得其宜也隂陽升降復歸内象隂去陽來復本位内見離同人次降天火同人卦次本陽上下二爻隂適變從離也離下乾上同人二氣同進健而炎上乾務上離務下同途異致性則合也易曰出門同人又誰咎也九二得位居中六三積隂待應易曰先號咷而後笑隔於陽位不能决勝先故曰號咷後獲合方喜也故曰後笑也八卦復位六爻遷次周而復始上下不停生生之義易道祖也天與火明而健陽道正隂氣和也六二居内卦中能奉於陽吉凶故象五行昭然金木水火土配六位相生與坎為飛伏己亥水戊午火歸魂立三公為世上九宗廟為應候建始丁巳至壬戌小滿寒露積算起壬戌至辛酉周而復始火土入乾離火上二象入乾離配六宫起積算五星從位起鎮星土星入卦定其吉凶觜宿從位降己亥水二十八宿分觜宿入離歸魂配天火同人九三己亥水土分氣候二十八起積算二十八位數廵六爻有吉凶入何位火上見金二氣雖同五行相悖六爻定位吉凶之兆在乎五二得時則順失時則逆隂陽升降嵗月分焉爻象相盪内外適變八卦巡迴歸魂復本本靜則象生故適離為兊入少女分八卦於兊象坎入兊宫八卦兊下兊上兊積隂為澤純金用體畜水凝霜隂道同也上六隂生與艮為合兊下六隂凝艮土於陽健納兊為妻二氣合也土木入兊水火應之二隂合體積于西郊秋王衝艮入乾氣類隂也配象為羊物類同也與艮為飛伏丁未土丙寅木上六宗廟在世六三三公為應建始乙卯至庚申春分立秋積算起庚申至己未周而復始金土入兊宫金土入兊宫起積算五星從位起太白太白金星入卦參宿從位降丁未土二十八宿分參宿入兊上六丁未土上分氣候三十六起宫算從三十六數起定吉凶内卦互體見離巽配火木入金宫分貴賤於强弱火强木弱吉凶隨爻算嵗月運氣逐休王隂陽升降變初九入初六陽入隂為坎象正體見陽位剛柔分吉凶見也適變内象入坎為困卦兊内卦初九變入坎坎下兊上困澤入坎險水不通困外禀内剛隂道長也隂陽不順吉凶生也易云困于石據于蒺藜入于其宫不見其妻凶上下不應隂陽不交二氣不合困卦上下無應隂陽不交六三隂上六亦隂無匹入九五求陽陽亦無納也五行配六位生悔吝四時休王金木交爭萬物之情在乎幾微與坎為飛伏戊寅木丁巳火初六元士為世九四諸侯在應建始丙辰至辛酉清明秋分積算起辛酉至庚申周而復始土金入坎兊分土金入坎兊配金宫起算五星從位起太隂水宿入兊卦起算井宿從位降戊寅二十八宿分井宿入困卦初六戊寅木分氣候其數二十八二十八起宫入積算定吉凶坎象互見離火入兊金水見運配吉凶隂陽升降坎入坤隂氣凝盛降入萃變通入萃卦坤下兊上萃金火分氣候土木入兊宫升降隂氣盛剛柔相應合九五定羣隂二氣悅而順萃卦丁酉金乙巳火二象刑而合也澤上於地積隂成萃易曰萃者聚也吉凶生陽氣合而悅凡聚衆必慎防閑假陽為主成萃之義伏戎必豫備衆聚去疑心與坤為飛伏乙巳火丁卯木六二大夫居世九五至尊見應建始戊寅至癸未立春大暑積算起癸未至壬午周而復始土木入坤兊分土木入兊宫起算五星從位起熒惑火星入金水宫推吉凶也翼宿從位降乙巳二十八宿分翼宿入萃六二位上分氣候二十八積算起二十八數六爻見吉凶澤下見坤二氣順木土入宫有愛惡木惡土愛也隂陽升降陽氣來止於坤象互見艮艮為陽兊象納艮隂氣强男下女次降澤山咸卦艮下兊上咸山下有澤虚已畜物陽中積隂感於物也陽下於隂男女之道内外相應感類於象也六二待聘九五見召二氣交感夫婦之道體斯合也易曰咸感也利取吉女艮少男兊少女男下於女取婦之象與艮為飛伏丙申金丁丑土九三三公居世上六宗廟為應建始戊午至癸亥芒種小雪積算起癸亥至壬戌周而復始火土入艮兊分火土象入艮兊也五星從位起熒惑火星南方入金宫柳宿從位降丙申二十八宿分柳宿入咸九三丙申金爻上分氣候三十六積算起數分三十六位起吉凶土上見金母子氣合隂陽相應剛柔定位吉凶隨爻受氣出則吉刑則凶隂陽等降入外險止於内象為山水蹇卦九四爻之入隂中剛艮下坎上蹇利於西南民道通也水在山上蹇險難進隂陽二氣否也隂待於陽柔道牽也險而逆止陽固隂長處能竭至誠於物為合蹇道亨也易曰王臣蹇蹇匪躬之故六二與坎為飛伏戊申金丁亥水六四諸侯居世初六元士在應建始己未至甲子大暑大寒積算起甲子至癸亥周而復始土水入坎艮水土二象入艮配金宫起算五星從位起鎮星土星入金宫星宿從位降戊申二十八宿分星宿入蹇六四戊申金土分氣候其數三十六積算起數三十六從六位五行土上見水柔而和此五行相推二氣合取象則隂陽相背也九五適變入坤宫宫比得朋隂氣合也外卦九五變入坤内見艮故曰得朋也將入謙卦取象坎降入地山謙艮下坤上謙六位謙順四象無凶一陽居内卦之上為謙之主易曰謙謙君子利涉大川隂陽不爭處位謙柔隂中見陽止順於謙有無之位上下皆通易曰撝謙無不順也與坤為飛伏癸亥水丁酉金六五居世大夫在應建始庚申至乙丑立秋大寒積算起乙丑至甲子周而復始金土入坤艮金土二象入兊宫起算也五星從位起太白太白金星入兊宫卦張宿從位降癸亥二十八宿分張宿入謙六五癸亥水上分氣候二十八積算起數二十八位坤在艮上順而止五行入位象謙柔吉凶隨爻適變隂陽升降至六五位返入游魂變歸六四盪六四一爻入陽也八卦相離四象分也次降入雷山小過卦艮下震上小過六四適變血脉通也陽入隂隂入陽二氣降内外象上下返應二剛相適九三九四土木入卦分於二象内艮外震雷處髙山亢之極也内柔無正性危及於外易曰飛鳥遺之音不宜上宜下與坤為飛伏庚午火癸丑土反歸九四諸侯立世元士見應建始乙丑至庚午大寒芒種積算起庚午至己巳周而復始土火入震艮外土火二象入兊宫五星從位起太隂水星入卦游魂翼宿從位降庚午二十八宿分翼宿入兊宫游魂小過卦九四庚午火上分氣候三十六積算三十六數六位吉凶木下見土二陽畜隂六位相刑吉凶生也上升下隂陽反應各私其黨六爻適變隂道悖也升降進退其道同也之艮入兊隂納與陽也反復其位次降入歸魂雷澤歸妹卦兊下震上歸妹隂復於本悅動於外二氣不交故曰歸妹歸者嫁也互見離坎同於未濟適陽從隂剛從外至九四至剛六三悅柔返無其應凶兌羊涉卦之終長何吉也與艮為飛伏丁丑土丙申金三公歸魂之世上六宗廟見應建始甲子至己巳大雪小滿積算起己巳至戊辰周而復始水土入震兊分水土二象入兊宫五星從位起嵗星木星東方入兊宫歸魂軫宿從位降丁丑土二十八宿分軫宿入兊歸魂六二丁丑土上分吉凶起算分氣候三十八積算起三十八數六位推五行數吉凶雷居澤上剛氣亢盛隂陽不合進退危也震長男兊少女少女匹長男氣非合也吉凶在上六處於動極適變位定時不可易之道也五行考象非合斯義隂陽運動適當何爻或隂或陽或柔或剛升降六位非取一也兊歸魂配六十四卦之終也京氏易傳巻中}
