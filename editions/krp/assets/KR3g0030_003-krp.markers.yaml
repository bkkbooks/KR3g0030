  - {type: variant, offset: 6, length: 3, content: 吳鬱林, WYG: 乾上乾純陽用事象配天屬金與坤為飛伏居世壬戌土癸酉金易云用九見羣龍无首吉純陽用九之徳九三三公為應肖乾乾夕惕之憂甲壬配外内二象乾為天地之首分甲壬入乾位積算起己巳火至戊辰土周而復始吉凶之兆積年起月積日起時積時起卦入本宫五星從位起鎮星土星入西方麗西北居壬戌為伏位參宿從位起壬戌壬戌在世居宗廟建子起潛龍十一月冬至一陽生建已至極主亢位四月龍見于辰陽極隂來吉去凶生用九吉配於人事為首乾為首也為君父乾象堅剛天地之尊故為君父於類為馬為龍天行運轉不息降五行頒六位十二辰分六位升降以時消息吉凶居西北之分野隂陽相戰之地易云戰于乾乾為陽西北隂陽入隂二氣盛必戰天六位地六氣六象六包四象分萬物隂陽無差升降有等陰陽二十四候律呂調矣人事吉凶見乎其象造化分乎有無故云變動不居周流六虚六位純陽隂象在中陽中隂隂中陽陽為君隂為臣陽為民隂為事陽實隂虚明暗之象隂陽可知三五為陽二四為隂初上潛亢水配位為福徳甲子水是乾之子孫木入金鄉居寶貝甲寅木是乾之財土臨内象為父母甲辰土是乾之父母火來四上嫌相敵壬午火是乾之官鬼金入金鄉木漸微壬申金同位傷木宗廟上建戌亥乾本位戌亥乾之位陽極隂生降入姤卦八卦例諸巽下乾上姤隂爻用事金木互體天下風行曰姤姤遇也易曰隂遇陽一隂初生陽氣猶盛隂未為敵與巽為飛伏元士居世辛丑土甲子水尊就卑子孫與父母相代位定吉凶只取一爻之象多以少為貴九四諸侯堅剛在上隂氣處下易云繫于金柅巽積隂入陽辛壬降内外象建庚午至乙亥芒種小雪積算起乙亥水至丙戌土周而復始災福之兆生乎五行升降也五星從位起}
