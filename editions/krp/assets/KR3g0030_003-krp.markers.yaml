  - {type: variant, offset: 8, length: 0, content: '', WYG: 在前易云初九不遠復无祇悔反至初九陽來隂復去違也六爻盛卦之體總稱也月一陽為一卦之主與震為飛伏庚子水乙未土初九元士之世六四諸侯見應建始乙未至庚子大暑大雪見候起坤六月至十一月戊子為正朔見復之兆積算起庚子至己亥積算起庚子至己亥十月至十一月年亦然周而復始土水見候五星從位起嵗星嵗星木星入復卦合水土配吉凶張宿從位降庚子二十八宿分張宿入復卦庚子水上分氣候二十八積算起數二十八定吉凶六爻坤上震下動而順是陽來盪隂隂柔反去剛陽復位君子進小人退易云休復元吉陽升陰降變六二入兊象次併臨二陽將進内為恱隂去陽來氣漸隆隂不敢拒陽奉命而已次降入地澤臨卦兊下坤上臨陽長隂消悅而順金土應候剛柔分震入兊二陽剛本體隂柔降入臨臨者大也陽爻健順陽交退散易曰君子之道易云至于八月凶建丑至未也陽長六爻反復吉凶之道可見矣至于八月入遯與兊為飛伏丁卯木乙巳火九二大夫立世六五至尊應上位建始丙申至辛丑立秋大寒七月積氣至六月吉凶隨爻考汙隆旺則隆衰則汙積算起辛丑至庚子積算起金土入卦推休咎于六爻五星從位起熒惑熒惑火星入卦用事翼宿從位在丁卯二十八宿翼宿入卦九二爻木上分氣候三十六定隂陽之數起于三十六積算坤下見兊悅澤臨陽升隂降入三陽乾象入坤即泰卦臨卦内象先陽長逼隂成乾為泰象外坤積隂内兊亦為隂二陽合體柔順之道不可貞吉凶以時配於六位用於陽長之爻成臨之義六三將變陽爻至次降入泰卦次入地天泰卦乾下坤上泰乾坤二象合為一運天入地交泰萬物生焉小往大來陽長隂危金土二氣交合易云泰者通也通於天地長於品彚陽氣内進隂氣升降升降之道成於泰象與乾為飛伏甲辰土乙卯木三公立九三為世上六宗廟為應候建始丁酉至壬寅秋分立春積算起壬寅至辛丑周而復始金土位上起積算吉凶五星從位起鎮星土星入卦軫宿從位降甲辰分氣候二十八積算起二十八數於甲辰位地下有天陽道浸長不可極極則否成三陽務上坤順而往往而不已否道至存泰之義在於六五隂居陽位能順於陽隂陽相納二氣相感終於泰道外卦純隂陽來剛柔成于震象隂降陽升居乾上成大壯次降隂升陽入雷天大壯卦乾下震上大壯内外二象動而健陽勝隂而為壯内陽升降二象俱陽曰大壯易曰羝羊觸藩羸其角進退難也壯不可極極則敗物不可極極則反故曰君子用罔小人用壯與震為飛伏庚午火癸丑上九四諸侯立世初九元士在應建始戊戌至癸卯寒露至春分積算起癸卯至壬寅土木入卦起積算五星從位起太白太白金星入卦角宿從位降庚午二十八宿入卦配角宿入大壮庚午九四爻上分氣候三十六積算起數庚午火定吉凶雷在天上健而動陽升隂降陽來盪隂吉凶隨爻著于四時九四庚午火之位入坤為卦之本起于子滅于寅隂陽進退六位不居周流六虚外象震入兊為隂悅適爻為剛長次降入夬陽決隂之象入澤天夬卦乾下兊上夬剛决柔隂道滅五陽務下一隂危上將反游魂九四悔也澤上於天君道行也夬五世六位周而復始為游魂至九四成隂入坎為需與兊為飛伏丁酉金癸亥水九五立世九二大夫為應九五在兊象為世澤小於天也建始己亥至甲辰小雪清}
