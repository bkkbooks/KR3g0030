  - {type: variant, offset: 0, length: 9301, content: 京氏易傳卷中吳鬱林太守陸績註明兵部侍郎范欽訂坤下坤上坤純隂用事象配地屬土柔道光也隂凝感與乾相納臣奉君也易云黄裳元吉六二内卦隂處中臣道正也與乾爲飛伏癸酉金壬戍土宗廟居世三公爲應未免龍戰之灾無成有終隂成陽君臣不敢爲物之始陽唱隂和君命臣終其事也初六起履霜至於堅氷隂雖柔順氣亦堅剛爲無邪氣也建始甲午至己亥芒種小滿積筭起巳亥至戊戍周而復始純土用事入積筭定吉凶五星從位起太隂太隂水星入卦西南方之卦鎮星入卦配坤西南星宿從位降癸酉金二十八宿八卦星宿降坤上六癸酉金分氣候三十六起積爲數三十六隂中有陽氣積萬象故曰隂中隂隂陽二氣天地相接人事吉凶見乎其象六位適變八卦分焉六位變動八卦顯著隂雖虚納于陽位稱實六五六三之類也升降反復不能久處千變萬化故稱乎易易者變也隂極則陽來隂消則陽長衰則退盛則戰易云上六龍戰于野其血玄黃陽屬乾配西北積隂之地隂盛故戰乾坤併處天地之氣雜稱玄黃也陽盪隂坤内卦初六適變入陽曰震隂盛陽㣲漸來之義故稱復次降陽入地雷復卦震下坤上復隂極則反陽道行一作正也易云君子道長小人道消又曰七日來復七日陽之稱也七九稱陽之數也謂坤上六隂極陽戰之地隂雖不能勝陽然正當盛陽不可輕犯六陽渉六隂反下七爻在初故稱七日日亦陽也六爻反復之稱註在前易云初九不逺復无秪悔反至初九陽來隂復去違也六爻盛卦之體總稱也月一陽爲一卦之主與震爲飛伏庚子水乙未土初九元士之世六四諸侯見應建始乙未至庚子大暑大雪見候起坤六月至十一月戊子爲正朔見復之兆積筭起庚子至巳亥積筭起庚子至巳亥十月至十一月年亦然周而復始土水見候五星從位起歲星歲星木星入復卦合水土配吉凶張宿從位降庚子二十八宿分張宿入復卦庚子水上分氣候二十八積筭起數二十八定吉凶六爻坤上震下動而順是陽來盪隂隂柔反去剛陽復位君子進小人退易云休復元吉陽升隂降變六二入兌象次併臨二陽將進内爲悅隂去陽來氣漸隆隂不敢拒陽奉命而巳火之入地澤臨卦兌下坤上臨陽長隂消悅而順金土應候剛柔分震入兌二陽剛本體隂柔降入臨臨者天也陽爻徤順陽交退散易曰君子之道易云至于八月凶建丑至未也陽長六爻反復吉凶之道可見矣至于八月入遯與兌爲飛伏丁卯木乙巳火九二大夫立世六五至尊應上位建始丙申至辛丑立秋大寒七月積氣至六月吉凶隨爻考汙隆旺則隆衰則汙積筭起辛丑至庚子積筭起金土入卦推休咎于六爻五星從位起熒惑熒惑火星入卦用事翼宿從位在丁卯二十八宿翼宿入卦九二爻木上分氣候三十六定隂陽之數起于三十六積筭坤下見兌悅澤臨陽升隂降入三陽乾象入坤即泰卦臨卦内象先陽長逼隂成乾爲泰象外坤積隂内兌亦爲隂二陽合體柔順之道不可貞吉凶以時配於六位用於陽長之爻成臨之義六三將變陽爻至次降入泰卦次入地天泰卦乾下坤上泰乾坤二象合爲一運天入地交泰萬物生焉小徃大來陽長隂危金土二氣交合易云泰者通也通於天地長於品彚陽氣内進隂氣升降升降之道成於泰象與乾爲飛伏甲辰土乙卯木三公立九三爲世上六宗廟爲應候建始丁酉至壬寅秋分立春積筭起壬寅至辛丑周而復始金土位上起積筭吉凶五星從位起鎭星土星入卦軫宿從位降甲辰分氣候二十八積筭起二十八數於甲辰位地下有天陽道浸長不可極極則否成三陽務上坤順而徃徃而不巳否道至存泰之義在於六五隂居陽位能順於陽隂陽相納二氣相感終於泰道外卦純隂陽來剛柔成于震象降陽升居乾上成大壯次降隂升陽入雷天大壯卦乾下震上大壯内外二象動而徤陽勝隂而爲壯内陽升降二象俱陽曰大壯易曰羝羊觸藩羸其角進退難也壯不可極極則敗物不可極極則反故曰君子用罔小人用壯與震爲飛伏庚午火癸丑土九四諸侯之世初九元士在應建始戊戍至癸卯寒露至春分積筭起癸卯至壬寅土未入卦起積筭五星從位起太白太白金星入卦角宿從位降庚午二十八宿入卦配角宿入大壯庚午九四爻上分氣候三十六積筭起數庚午火定吉凶雷在天上徤而動陽升隂降陽來盪隂吉凶隨爻著于四時九四庚午火之位入坤爲卦之本起于子滅于寅隂陽進退六位不居周流六虚外象震入兌爲隂悅適爻爲剛長次降入夬陽决隂之象入澤天夬卦乾下兌上夬剛决柔隂道滅五陽務下一隂危上將反游魂九四悔也澤上於天君道行也夬五世六位周而復始爲游䰟至九四成隂入坎爲需與兌爲飛伏丁酉金癸亥水九五立世九二大夫爲應九五在兌象爲世澤小於天也建始巳亥至甲辰小雪清明積筭起甲辰至癸卯周而復始金木分乾兌入坤象入坤宫起積筭五星從位起太隂太隂水位入卦起筭亢宿從位降丁酉二十八宿配亢宿入夬卦丁酉金上起分氣候二十八積筭起宫二十八入卦甲辰還丁酉金上定吉凶易云澤上於天夬揚于王庭柔道消消不可極反於游魂九四柔來文剛隂道存也隂之道不可終否剛柔相濟日月明矣天地定位人事通也凡卦隂極陽生陽極隂生生生之義不絶之貌日月循環天地交泰隂陽相盪六位交分萬物生焉故曰雷動風行山澤通氣人之運動體斯合矣人禀五常三焦九竅風火逓相兼濟以一位虧四體羸焉隂陽升降反復道也次降入游魂水天需卦乾下坎上需雲上於天凝於隂而待於陽故曰需需者待也三陽務上而隔於六四路之險也外卦坎水爲險亦隂稱血也坤之反覆適陽入隂夬卦九四入需卦成六四陽之位也隂陽交會運動隂雨積而凝滯於陽通乃合也羣陽務上一隂報之故凝滯雨乃合與兌爲飛伏戊申金丁亥水游魂立世諸侯應初九元士建始甲辰至已酉清明秋分積筭起己酉至戊申周而復始金土入乾坎積筭起宫定吉凶五星從位起歲星歲星木星入卦氐宿從位降戊申二十八宿降氏宿入坤宫游䰟卦六四戊申金土起積筭吉凶分氣候三十六定吉凶總三十六位起筭乾外見坎徤而進隘在前也需與飲食爭於坎也隂陽相激勝負有倚反爲不速敬終有慶隂陽漸消陽道行行反復其位不妄於隂坎降入歸魂水地比卦坤之歸魂也坤下坎上比反本復位隂陽相定六爻交互一氣在也水在地上九五居尊萬民服也比卦一陽五隂少者爲貴衆之所尊者也比親於物物亦附焉原筮於宗歸之於衆諸侯列土君上崇之奉于宗祧盟契無差邦必昌矣與乾爲飛伏乙卯木甲辰土歸魂六之三公居世應上六宗廟建始癸卯至戊申春分立秋積筭起熒惑火星入卦房宿從位降乙卯二十八宿配房宿入坤歸䰟乙卯木位上分氣候二十八積筭起二十八數隂道將復以陽爲主一陽居尊羣隂宗之六爻交分吉凶定矣地道之義妻道同也臣之附君比道成也歸魂復本隂陽相成萬物生也故曰坤生三女巽離兌分長中下巽長女離中女兌少女以陽求隂乾之巽爲長女巽下巽上巽陽中積隂而巽順本乾象隂來盪成巽巽者順也風從穴入於物號令齊順天地明也内外禀於一隂順於天地道也聲聞於外逺彰柔順隂陽升降柔於剛也本於堅剛隂來又柔東南向明齊肅隂陽與震爲飛伏辛卯木庚戍土宗廟居世三公在應上九九三建始辛丑至丙午大寒芒種積筭起丙午至乙巳周而復始火木與二十八宿分虚宿入翼上九辛卯木土分氣候其數三十六分三十六數入卦起筭隂氣起陽陽順於隂隂陽和柔升降得位剛柔分也隂不可盈晷刻傾也初六適變陽來隂退徤道行也三陽務進外隂陽也適變於内外未從也次降隂交於陽九爲小畜卦初六變初九也乾下巽上小畜易云密雲不雨自我西郊小畜之義在於六四三陽連進於一危也外巽體隂畜道行也巽之初六隂盪陽氣感積隂不能固退復本位三連同徃而不可見成於畜義外象明矣一隂劣不能固陽是以徃也外巽積隂能固陽道成在上九一爻之法也易云旣雨旣處也與乾爲飛伏甲子水辛丑土初九元士居世六四諸侯在應建始壬寅至丁未立春大暑積筭起丁未至丙午周而復始木土入乾巽入宫起筭法五星從位起太白金星入卦起筭吉凶尾宿從位降甲子二十八宿入卦分尾宿以小畜甲子水上起筭分氣候其數二十八分二十八數起宫推筭一隂居六四建子入陽宮推其休咎處吉凶剛徤立陽爻隂凝在巽體易云輿說輹夫妻反目不義之兆夏至起純隂陽爻位伏藏冬至陽爻動隂氣凝地隂陽升降以柔爲剛見中虚文明積氣居内象九二適變入離次降入風火家人卦離下巽上家人乾剛俱變文明内外相應九五應六二爻隂陽得位居中履正火上見風家人之象閑邪存誠嗃嗃得中互體見文明家道明也内平遇坎險象家人難也酌中之義在於六二與離爲飛伏已丑土辛亥水建始癸卯至戊申春分立秋積筭起戊申至丁未金土入離巽金土入卦同積筭大夫居世應九五立君位五星從位起太隂太隂北方入卦起宫推筭箕宿從位降巳丑二十八宿分箕宿入家人卦在巳丑土上分氣候其數三十六三十六起數家人卦推入積筭休咎火木分形隂陽得位内外相資二氣相合君君臣臣父父子子兄兄弟弟易曰家人嗃嗃父子嘻嘻治家之道分於此也吉凶之義配五行進退六五進退吉凶於隂陽隂陽得起在於四時運動吉凶見矣分内外矣二象配天地星辰合命定吉凶文明運動變化之象九三適隂入震風爲雷合曰益次降風雷益卦震下巽上益天地不交曰否六二隂上柔剛九四下降積隂故爲益易曰損上益下雷動風行男下女上震男巽女陽益隂君益於民之仰也互見坤坤道柔順又外見艮艮止陽益隂止於陽柔道行也内外順動風雷益四象分明剛柔定矣與震爲飛伏庚辰土辛酉金六三三公居世上九宗廟爲應建始甲辰至巳酉清明秋分積筭起巳酉至戊申周而復始土金入震巽起積配風雷益卦起宫五星從位起歲星木星入卦計宿從位降庚辰二十八宿分計宿入風雷益六二庚辰土上分氣候二十八起二十八數積筭吉凶周而復始隂陽二木合金土配象四時運轉六位交分休廢旺生吉凶見乎動爻配日月星辰進退運氣升降復當何位金水木火土適變於外隂入陽爻二象徤而動屬於天地也天陽震雷亦陽也二氣相激動而健天行也隂陽相盪次降入天雷无妄卦震下乾上无妄乾剛震動二氣運轉天下見雷行正之道剛正陽長物无妄矣内互見艮止於純陽外互見巽順於陽道天行徤而動剛正於物物則順也金木配象吉凶明矣金木配乾震入卦與乾爲飛伏壬午火辛未土九四諸侯在世初九元士立應上建始乙巳至庚戍小滿寒露積筭起庚戍至巳酉周而復始火土入乾震火土分乾震入无妄卦起積筭五星從位起熒惑火星入卦定吉凶牛宿從位降壬午二十八宿分牛宿入无妄壬午火位上分氣候三十六三十六數起卦積筭上金下木二象相衝隂陽升降徤而動内見一陽應動剛五行分配吉凶半矣二氣各争九五適變入文柔隂盪陽爻歸復位剛柔履次明在外進退吉凶見中虚次降入火雷噬嗑卦震下離上噬嗑柔乘文剛積氣居中隂道明白動見文明雷電合分威光而噬嗑也易曰頥中有物曰噬嗑隂陽分中動而明象雷電也物有不齊齧而噬吉凶之道象於五行順則吉逆則凶火木合卦配升降與離爲飛伏己未火辛巳土六五居尊應六二大夫建始丙午至辛亥芒種小雪積筭起辛亥至庚戍周而復始火土入離震分火土二位入噬嗑卦起積筭爻推配星辰歲月日時進退吉凶五星從位起鎭星土星入卦女宿從位降巳未土二十八宿分女宿入卦六五巳未土也分氣候二十八從二十八位數起八卦筭吉凶火居水上陽中見隂陽雜氣渾而溷吉凶適變隨時見也返復隂游魂入卦降下九四陽入隂五行進退始終之道斯可驗矣升降六爻極返終下降山雷頥卦震下艮上頥六位上下周而復始内外交互降入純隂見坤象居中地之氣萃在其中上下陽位包隂積純和之氣見浩然之道明矣土木配象吉凶從六虚六虚即六爻也與震爲飛伏丙戍土巳酉金六四諸侯在世元士之初九見應建始辛亥至丙辰小雪清明積筭起丙辰至乙卯周而復始土木入艮震分土木二象入卦筭吉凶五星從位起太白金星西方入八月卦上衝虚宿從位降丙戍土二十八宿分虚宿入頥六四丙戍土上分氣候三十六起數二十八推六爻吉凶之位山下有雷止而動隂陽通變分氣候内外剛而積中柔升降游魂下居六四位特分復歸於本游䰟返居六四入卦周始爻位遷次明矣吉凶起於六四次環六位星宿躔次也極則反本降入歸魂山風蠱卦巽下艮上蠱適六爻隂陽上下本道存也氣運周而復始山下見風止而順内互悅而動易云蠱者事也先甲後甲事分而令行金土合木象復本曰歸魂與震爲飛伏辛酉金庚辰土九三歸魂立三公在世應上九見宗廟建始庚戍至乙卯寒露春分積筭起乙卯至庚寅周而復始土木入艮巽土木分艮巽宫五星從位起太隂太隂水星入卦用危宿從位降辛酉金二十八宿危宿入巽歸䰟山風蠱九三辛酉金位上分氣候二十八起積筭數二十八卦宫定吉凶木上見土風落山貞幹於父事隂陽復位長㓜分焉八卦循環始於巽歸魂内象見還元六爻進退吉凶在於四時積筭起宫從乎建始卦用及身也升隂陽巽宫適變入離文柔分矣隂入陽退見中虚次水中女八卦相盪隂陽定位遷入離宫八卦純火以日用事離下離上離本於純陽隂氣貫中禀於剛徤見乎文明故易曰君子以繼明照于四方離卦中虚始于乾象純則徤不能柔明故以北方隂氣貫中柔剛而文明也陽爲隂主陽伏於隂也成卦義在六五是以體離爲日爲火始於陽象而假以隂氣純用剛徤不能明照故以隂氣入陽柔於剛徤而能順柔中虚見火象也是以離取中虚氣炎方能照物日昌火本陽象也純以隂又不能乾於物純以陽又暴於物故取隂柔於中女能成於物也與坎爲飛伏己巳火戊子土宗廟爲世應上見三公上九九三建始戊申至癸丑立秋至大寒積筭起癸丑至壬子火取胎月至本月周而復始土水二象入離火位土水二位入卦起筭五星從位起歲星木星入火宫卦室宿從位降巳巳火二十八宿分室宿入離宫上九巳火上也分氣候三十六積筭起數三十六立位定吉凶内外二象配於火土爲祥土木入離爲祥互見悅順著於明兩兌巽二象隂陽升降入初九適變從隂止於艮象内卦變也吉凶從位起至六五休廢在何爻看當何位金水木火土與本宫刑宫次降入火山旅卦初九爻變之艮下離上旅隂中見陽盪入陽中隂陽二氣交互見本象火居山上爲旅之義離爲隂初九爲陽艮爲陽初六爲隂二氣交互上下見木也火在上無止象旅之義易曰旅人先笑後號咷又曰得其資斧仲尼爲旅人固可知矣旅卦爲取象火在山上顯露無止五行八卦消息去此還也與艮爲飛伏丙辰土巳卯木其居初六元士九四諸侯見應建始巳酉至甲寅秋分立春積筭起甲寅至癸丑周而復始金入木土離艮金木土入卦起積筭五星從位起熒惑火星入卦見本象壁宿從位降丙辰二十八宿壁宿入旅卦初六丙辰土位上起筭分氣候三十六分三十六數起卦推筭火土同宫二氣合應隂陽相對吉凶分乎隂位上九陽居宗廟得䘮于易六五爲卦之主不係于一凶其宜也内象適變盪隂入陽巽順於物進退意噐外象明應内爲鼎次降火從風入鼎初九之初六六二之九二巽爲風二象火曰鼎巽下離上鼎木能巽火故鼎之象亨飪見新供祭明矣易曰鼎取新木見火中發火木相資象鼎之兆下穴爲足中虚見納飪熟之義明矣凡飪熟享祀爲先故曰供祭明矣變生也隂陽得應居中履順三公之義繼於君也九三成鼎之德六五委任得賢臣假之位以斯明也隂穴見火順於上也中虚見納受辛於内也金玉之鉉在乎陽饗新亨飪在乎隂與巽爲飛伏辛亥水巳丑土九二立大夫爲世六五居尊見應建始庚戍至乙卯寒露春分積筭起乙卯至甲寅周而復始分土木入離巽分土木二象入爲巽配鼎卦五星從位起鎮星土星入火宫奎宿從位降辛亥水二十八宿分奎宿入鼎卦九二辛亥位上分氣候三十六起宫數三十六宫配卦筭吉凶火居木上二氣交合隂陽巽順噐具形存金玉堅剛配象隂陽升降六位遞相遷次九三適變以陽入隂見乎坎險鼎九三爻之義隂成坎卦外象坎外離二氣不交見未濟卦降入水火未濟卦坎下離上未濟隂陽二位各復本體六爻交互異於正象離炎上坎務下二象不合各殊隂陽交納是以異於本象也故取未濟名之世應得位隂陽殊塗九二六五性命不交吉凶列矣坎性離命與坎爲飛伏戊午火巳亥水六三三公爲世應宗廟上九建始辛亥至丙辰小雪清明積筭起丙辰至丁卯水土二象入離坎分水土入卦五星從位起太白金星入離宫卦分六爻婁宿從位降戊午火二十八宿分婁宿入未濟六二戊午火位土定吉凶入積筭分氣候二十八積筭二十八數至吉凶處水火二象坎離相納受性本異立位見隔睽于上下吉凶生也子午之位受刑見害氣不合也隂陽升降入於外卦適離爲艮上著於象艮上著離也天地盈虛與時消息其大也次降入山水䝉卦坎下艮上䝉積陽居隂止於坎䧟養純正素居中得位易云山下出泉䝉二象摽正天下通也擊暗釋疑陽道行也内實外正暗得明隂附於陽稚道亨也故曰䝉養正與艮爲飛伏丙戍土乙酉金諸侯立世元士爲應六四初六建始壬子至丁巳大雪小滿積筭起丁巳至丙辰周而復始火土入艮坎火土二象入卦同筭五星從位起太隂水星北方入宮起筭胃宿從位降丙戍土二十八宿分胃宿入䝉卦六四丙戍土上分氣候三十六起數二十八從六位推筭山下見水畜聚居中分流萬派六位不居吉凶適變水土分也五行入卦筭吉凶逐四時行因廢王吉則王凶則廢隂陽進退歲時物也六五陽中積隂入巽見隂中陽二氣相盪不可盈望次降入風水渙卦六五變入九五陽中隂入陽中陽適變徃于他宫位不出本宫坎下巽上渙水上見木渙然而合渙者散也内外徤而順納實居中正互見動而上虚舟行也隂陽二象資而益也風行水上處險非溺也木浮于水也九五履正思順非偪也與巽爲飛伏辛巳火巳未土九五居尊大夫應九二爻也建始癸丑至戊午大寒芒種積筭起戊午至丁巳周而復始火土入坎巽火土二象入坎巽配火宫渙卦起筭五星從位起歲星木星入火宫木象昴宿從位降辛巳火二十八宿分昴宿入渙九五辛巳火位上分氣候其數二十八起筭從二十八位上推六爻吉凶歲月日時爲候内卦坎中滿一陽居中積實于内風在外行虚聲外順吉凶之位攷乎四序盛衰之道在乎機要隂陽死于位生于時死于時生于位進退不可詰正盛則衰來正衰則盛來易曰積善之家必有餘慶積不善之家必有餘殃八卦始終六虚反復游魂生巽入乾爲天水訟卦坎下乾上訟生生不絶之謂道六位不居返爲游魂離宫八卦以訟爲反四五至四也天與水違曰訟天道西行水東流其路背也外象乾西北方之卦内坎水正北方之卦其流東也二氣不交曰訟五行所占六位定吉凶非所背順爲正金與水二氣相資父子之謂徤與險内外相激家國之義出象故以則斯可驗矣與巽爲飛伏壬午火辛未土諸侯居世元士見應九四初六建始戊午至癸亥芒種小雪積筭起癸亥至壬戍周而復始火水入卦火水二象入離宫配六位積筭推日月歲時五星從位起熒惑火星入火宮同起積筭畢宿從位降壬午火二十八宿分畢宿東方宿入離游䰟天水訟卦九四壬午火土也分氣候三十六起宫從三十六位筭吉凶天下見水隂陽相背二氣不交物何由生吉凶宗於上九進退見於九四二居中履正得其宜也隂陽升降復歸内象隂去陽來復本位内見離同人次降天火同人卦次本陽上下二爻隂適變從離也離下乾上同人二氣同進徤而炎上乾務上坎務下同途異致性則合也易曰出門同人又誰咎也九二得位居中六三積隂待應易曰先號咷而後笑隔於陽位不能决勝先故曰號咷後獲合方喜也故曰後笑也八卦復位六爻遷次周而復始上下不停生生之義易道祖也天與火明而徤陽道正隂氣和也六二居内卦中能奉於陽吉凶故象五行昭然金木水火土配六位相生與坎爲飛伏己亥水戊午火歸魂立三公爲世上九宗廟爲應候建始丁巳至壬戍小滿寒露積筭起壬戍至辛酉周而復始火土入乾離火土二象入乾離配六宫起積筭五星從位起鎮星土星入卦定其吉凶觜宿從位降己亥水二十八宿分觜宿入離歸䰟配天火同人九三己亥水上分氣候二十八起積筭二十八位數廵六爻有吉凶入何位火上見金二氣雖同五行相悖六爻定位吉凶之兆在乎五二得時則順失時則逆隂陽升降歲月分焉爻象相盪内外適變八卦廵廻歸魂復本本靜則象生故適離爲兌入少女分八卦於兌象坎入兌宫八卦兌下兌上兌積隂爲澤純金用體畜水凝霜隂道同也上六隂生與民爲合兌下六隂凝艮上於陽徤納兌爲妻二氣合土木入兌水火應之二隂合體積于西郊秋王衝震入乾氣類隂也配象爲羊物類同也與艮爲飛伏丁未土丙寅木上六宗廟在世六三三公爲應建始乙卯至庚申春分立秋積筭起庚申至已未周而復始金土入兌宫金土入兌宫起積筭五星從位起太白太白金星入卦參宿從位降丁未土二十八宿分參宿入兌上六丁未土上分氣候三十六起宮筭從三十六數起定吉凶内卦互體見離巽配火木入金宫分貴賤於強弱火強木弱吉凶隨爻筭歲月運氣逐休王隂陽升降變初九入初六陽入隂爲坎象正體見陽位剛柔分吉凶見也適變内象入坎爲困卦兌内卦初九變入坎坎下兌上困澤入坎險水不通困外禀内剛隂道長也隂陽不順吉凶生也易云困于石據于蒺藜入于其宫不見其妻凶上下不應隂陽不交二氣不合困卦上下無應隂陽不交六三隂上六亦隂無匹入九五求陽陽亦無納也五行配六位生悔吝四時休王金木交争萬物之情在乎幾㣲與坎爲飛伏戊寅木丁巳火初六元士爲世九四諸侯在應建始丙辰至辛酉清明秋分積筭起辛酉至庚申周而復始土金入坎兌分土金入坎兌配金宫起筭五星從位起太隂水宿入兌卦起筭井宿從位起太隂降戊寅二十八宿分井宿入困卦初六戊寅木分氣候其數二十八二十八起宫入積筭定吉凶坎象互見離火入兌金水見運配吉凶隂陽升降坎入坤隂氣凝盛降入萃變通入萃卦坤下兌上萃金火分氣候土木入兌宫升降隂氣盛剛柔相應合九五定羣隂二氣悅而順萃卦丁酉金乙巳火二象刑而合也澤上於地積隂成萃易曰萃者聚吉凶生陽氣合而悅凡聚衆必慎防閑假陽爲主成萃之義伏戎必豫備衆聚去疑心與坤爲飛伏乙巳火丁卯木六二大夫居世九五至尊見應建始戊寅至癸未立春大暑積筭起癸未至壬午周而復始土木入坤兌分土木入兌宫起筭五星從位起熒惑火星入金水宫推吉凶也翼宿從位降乙巳二十八宿分翼宿入萃六二位上分氣候二十八積筭起二十八數六爻見吉凶澤下見坤二氣順木土入宫有愛惡木惡土愛也隂陽升降陽氣來止於坤象互見艮艮爲陽兌象納艮隂氣強男下女次降澤山咸卦艮下兌上咸山下有澤虚巳畜物陽中積隂感於物也陽下於隂男女之道内外相應感類於象也六二待聘九五見召二氣交感夫婦之道體斯合也易曰咸感也利取女吉艮少男兌少女男下於女取婦之象與艮爲飛伏丙申金丁丑土九三三公居世上六宗廟爲應建始戊午至癸亥芒種小雪積筭起癸亥至壬戍周而復始火土入艮兌分火土象入艮兌也五星從位起熒惑火星南方入金宫桞宿從位降丙申二十八宿分桞宿入咸九三丙申金爻上分氣候三十六積筭起數分三十六位起吉凶土上見金母子氣合隂陽相應剛柔定位吉凶隨爻受氣出則吉刑則凶隂陽等降入外險止於内象爲山水蹇卦九四爻之入隂中剛艮下坎上蹇利於西南民道通也水在山上蹇險難進隂陽二氣否也隂待於陽柔道牽也險而逆止陽固隂長處能竭至誠於物爲合蹇道亨也易曰王臣蹇蹇匪躬之故六二與坎爲飛伏戊申金丁亥水六四諸侯居世初六元士在應建始己未至甲子大暑大寒積筭起甲子至癸亥周而復始土水入坎艮水土二象入艮配金宫起筭五星從位起鎭星土星入金宫星宿從位降戊申二十八宿分星宿入蹇六四戊申金上分氣候其數三十六積筭起數三十六從六位五行土上見水柔而和此五行相推二氣合取象則隂陽相背也九五適變入坤官宫比得朋隂氣合也外卦九五變入坤内見艮故曰得朋也將入謙卦取象坎降入地山謙艮下坤上謙六位謙順四象無凶一陽居内卦之上爲謙之主易曰謙謙君子利渉大川隂陽不争處位謙柔隂中見陽止順於謙有無之位上下皆通易曰撝謙無不順也與坤爲飛伏癸亥水丁酉金六位居世大夫在應建始庚申至乙丑立秋大寒積筭起乙丑至甲子周而復始金土入坤艮金土二象入兌宫起筭也五星從位起太白太白金星入兌宫卦張宿從位降癸亥二十八宿分張宿入謙六五癸亥水上分氣候二十八積筭起數二十八位坤在艮上順而止五行入位象謙柔吉凶隨爻適變隂陽升降至六五位返入游魂變歸六四盪六四一爻入陽也八卦相離四象分也次降入雷山小過卦艮下震上小過六四適變血脉通也陽入隂隂入陽二氣降内外象上下返應二剛相適九三九四土木入卦分於二象内艮外震雷處高山亢之極也内柔無正性危及於外易曰飛鳥遺之音不宜上宜下與坤爲飛伏庚午火癸丑土反歸九四諸侯立世元士見應建始乙丑至庚午大寒芒種積筭起庚午至巳巳周而復始土火入震艮外土火二象入兌宫五星從位起太隂水星入卦游䰟翼宿從位降庚午二十八宿分翼宿入兌宫游䰟小過卦九四庚午火上分氣候三十六積筭三十六數六位吉凶木下見土二陽畜隂六位相刑吉位生也上升下隂陽反應各私其黨六爻適變隂道悖也升降進退其道同也之艮入兌隂納與陽也反復其位次降入歸魂雷澤歸妹卦兌下震上歸妹隂復於本悅動於外二氣不交故曰歸妹歸者嫁也互見離坎同於未濟適陽從隂剛從外至九四至剛六三悅柔返無其應凶並羊渉卦之終長何吉也與艮爲飛伏丁丑土丙申金三公歸魂之世上六宗廟見應建始甲子至己巳大雪小滿積筭起己巳至戊辰周而復始水土入震兌分水土二象入兌宫五星從位起歲星木星東方入兌宫歸䰟軫宿從位降丁丑土二十八宿分軫宿入兌歸䰟六二丁丑土上分吉凶起筭分氣候三十八積筭起三十八數六位推五行數吉凶雷居澤上剛氣亢盛隂陽不合進退危也震長男兌少女少女匹長男氣非合也吉凶在上六處於動極適變位定時不可易之道也五行考象非合斯義隂陽運動適當何爻或隂或陽或柔或剛升降六位非取一也兌歸䰟配六十四卦之終也京氏易傳卷中, WYG: ''}
