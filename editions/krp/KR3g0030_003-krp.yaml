front:
  text: 京氏易傳卷下
  hash: sha256:c231111946b5e4de17bf9e736ea8942364c6f1b28021d0665183b4ae39e90280
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3g0030_SBCK_003-1a}
body:
  text: 吳鬱林太守陸績註明兵部侍郎范欽訂夫易者象也爻者效也聖人所以仰觀俯察象天地日月星辰草木萬物順之則和逆之則亂夫細不可窮深不可極故揲蓍布爻用之於下筮分六十四卦配三百六十四爻序一萬一千五百二十策定天地萬物之情狀故吉凶之氣順六爻上下次之八九六七之數内外承乘之象故曰兼三才而兩之孔子曰陽三隂四位之正也三者東方之數東方日之所出又圓者徑一而開三也四者西方之數西方日之所入又方者徑一而取四也言日月終天之道故易卦六十四分上下象隂陽也竒耦之數取之於乾坤乾坤者隂陽之根本坎離者隂陽之性命分四營而成易十有八變而成卦卦象定吉凶明得失降五行分四象順則吉逆則凶故曰吉凶悔吝生乎動又曰明得失於四序言吉凶生乎動五行休廢内犯胎養合五行運機布度其氣轉易主者亦當則天而行與時消息安而不忘亡將以順性命之理極蓍龜之源重三成六能事畢矣分天地乾坤之象益之以甲乙壬癸乾坤二分天地隂陽之木故分甲乙壬癸隂陽之終始震巽之象配庚辛庚陽入震辛隂入巽坎離之象配戊巳戊陽入坎已隂入離艮兌之象配丙丁丙陽入艮丁隂入兌八卦分隂陽六位五行光明四通變易立節天地若不變易不能通氣五行迭終四時更廢變動不居周流六虛上下無常剛柔相易不可以爲典要惟變所適吉凶共列于位進退明乎機要易之變化六爻不可據以隨時所占周禮太卜一曰連山二曰歸藏三曰周易初爲陽二爲隂三爲陽四爲隂五爲陽六爲隂一三五七九陽之數二四六八十隂之數隂主賤陽主貴隂從午陽從子子午分行子左行午右行左右凶吉吉凶之道子午分時立春正月節在寅坎卦初六立秋同用雨水正月中在丑巽卦初六處暑同用驚蟄二月節在子震卦初九白露同用春分二月中在亥兌卦九四春秋分同用清明三月節在戍艮卦六四寒露同用榖雨三月中在酉離卦九四霜降同用立夏四月節在申坎卦六四立冬同月小滿四月中在未巽卦六四小雪同用芒種五月節在午乾宫九四大雪同用夏至五月中在巳兌宫初九冬至同用小暑六月節在辰艮宫初六小寒同用大暑六月中在卯離宫初九大寒同用孔子易云有四易一世二世爲地易三世四世爲人易五世六世爲天易游魂歸魂爲鬼易八卦鬼爲繫爻財爲制爻天地爲義爻天地即父母也福德爲寳爻福德即子孫也同氣爲專爻兄弟爻也龍德十一月在子在坎卦左行虎刑五月午在離卦右行甲乙庚辛天官申酉地官丙丁壬癸天官亥子地官戊己甲乙天官寅卯地官壬癸戊已天官辰戍地官靜爲悔發爲貞貞爲本悔爲末初爻上二爻中三爻下三月之數以成一月初爻三日二爻三日三爻三日名九日餘有一日名曰閏餘初爻十日爲上旬二爻十日爲中旬三爻十日爲下旬三旬三十積旬成月積月成年八八六十四卦分六十四卦配三百八十四爻成萬一千五百二十策定氣候二十四考五行於運命人事天道日月星辰局於指掌吉凶見乎其位繫乎吉凶悔吝生乎動寅中有生火亥中有生木巳中有生金亦云上生之位申中有生水丑中有死金戍中有死火未中有死木辰中有死水土兼於中建子陽生建午隂生二氣相衝吉凶明矣積筭隨卦起宫乾坤震巽坎離艮兌八卦相盪二氣陽入隂隂入陽二氣交互不停故曰生生之謂易天地之内無不通也乾起巳坤起亥震起午巽起辰坎起子離起丑艮起寅兌起於六十四卦遇王則吉廢則凶衝則破刑則敗死則危生則榮攷其義理其可通乎分三十爲中六十爲上三十爲下總一百二十通隂陽之數也新新不停生生相續故淡泊不失其所確然示人隂陽運行一寒一暑五行互用一吉一凶以通神明之德以類萬物之情故易所以㫁天下之理定之以人倫而明王道八卦建五氣立五常法象乾坤順於隂陽以正君臣父子之義故易曰元亨利貞夫作易所以垂教教之所𬒳本𬒳於有無且易者包備有無有吉則有凶有凶則有吉生吉凶之義始於五行終於八卦從無入有見灾於星辰也從有入無見象於隂陽也隂陽之義歲月分也歲月旣分吉凶定矣故曰八卦成列象在其中矣六爻上下天地隂陽運轉有無之象配乎人事八卦仰觀俯察在乎人隱顯灾祥在乎天考天時察人事在乎卦八卦之要始於乾坤通乎萬物故曰易窮則變變則通通則乆乆於其道其理得矣卜筮非襲於吉唯變所適窮理盡性于兹矣晁氏公武曰漢藝文志易京氏凡三種八十九篇隋經籍志有京氏章句十卷又有占候十種七十三卷唐藝文志有京氏章句十卷而易占候存者五種二十三卷今其章句亡矣乃畧見於僧一行及李鼎祚之書今傳者曰京氏積筭易傳三卷雜占條例法一卷或共題易傳四卷而名皆與古不同今所謂京氏易傳者或題曰京氏積筭易傳者疑隋唐志之錯卦是也雜占條例法者疑唐志之逆刺占災異是也錯卦在隋七卷唐八卷所謂積筭雜逆刺占灾異十二卷是也至唐逆刺三卷而亡其八卷元祐八年高麗進書有京氏周易占十卷疑隋周易占十二卷是也是古易家有書而無傳者多矣京氏之書幸而與存者纔十之一尚何離夫師說邪景迂嘗曰余自元豐壬戍偶脫去舉子事業便有志學易而輙本好王氏妄以謂弼之外當自有名象者果得京氏傳而文字顚倒舛訛不可訓知迨其服習甚乆漸有所窺今三十有四年矣乃能以其象數辨正文字之舛謬於邉郡山房寂寞之中而私識之曰是書兆乾坤之二象以成八卦凡八變而六十有四於其徃來升降之際以觀消息盈虚於天地之元而酬酢乎萬物之表者炳然在目也大抵辨三易運五行正四時謹二十四氣志七十二候而位五星降二十八宿其進退以幾而爲一卦之主者謂之世竒耦相與據一以起二而爲主之相者謂之應世之所位而隂陽之肆者謂之飛隂陽肇乎所配乾與坤震與坎巽與離艮與兌而終不脫乎本以飛某位之卦乃伏某宫之位以隱顯佐神明者謂之伏起乎世而周乎内外參乎本數以紀月者謂之建終之始之極乎數而不可窮以紀日者謂之積會於中而以四爲用一卦備四卦者謂之互乾建甲子於下坤建甲午於上八卦之上乃生一世之初初一世之五位乃分而爲五世之位其五世之上乃爲游魂之世五世之初乃爲歸魂之世而歸魂之初乃生後卦之初其建剛日則節氣乘日則中氣其數虚則二十有八盈則三十有六盖其可言者如此若夫象遺乎意意遺乎言則錯綜其用唯變所適或兩相配而論内外二象若世與内革水火配位離火四世水若世與外用金木交争外先金初世木或不論内外之象而論其内外之位萃土水入艮兌𥘉土四水或三相參而論内外與飛賁土火木分隂陽艮土離火飛水若伏旅火土木入離艮離火艮土休伏木或相參而論内外世應建伏觀金土火木互爲體建金水應内土伏火外木或不論内外而論世建與飛伏益金土入震索也與飛土建與伏金或兼論世應飛伏復水土見候世應水土飛伏水土屯土木應象世應土木飛伏土水或專論世應夬金木合乾先入坤象世金應木蠱金木入艮巽世金應木或論世之所忌履金火入卦初九火九四火克九五世金爻及乾文金或論世之所生巽火木與巽同宫世木巽木見火於其所起見其所滅大壯起于子滅于亥於其所形見其所生隨金木交形水火相激兌金巽木故曰死於位生於時死於時生於位苟非彰徃而察來㣲顯而闡幽者曷足以與此前是小王變四于九十有六卦後有管輅定乾之軌七百六卦復有八坤之軌六百七十有二其知之者將可以語邵康節三易矣徒小王之徒唯知尚其詞耳其謂斯何昔魯商瞿子木受易孔子五傳而至漢田何子裝何授洛陽丁光光授碭田王孫王孫授東海孟喜孟喜授梁焦贑延壽延壽授房房授東海殷嘉河東姚平河南乗弘由是易有京房之學而傳盛矣有瞿牧自生者不肯學京氏曰京非孟氏學也劉向亦疑京託之缺一字孟氏不知當時爲何說也今以當時之書驗之盖有孟氏京房十一篇以大異孟氏京房六十六篇與夫京氏殷嘉十二篇同爲一家之學則其源委孰可誣哉此亦學者不可不知也若小王者果何所授受邪盖自京氏爲王學有餘力而王學之適京氏則無繇矣或傳是書而文字舛謬得以予言而攷諸凡學不可就正者缺以待來哲積筭雜占條例法具如别録乾姤遁否觀震豫解恒升剥晉大有井大過隨坎節屯旣濟革艮賁大畜損豐明夷師睽離中孚漸坤復臨泰大壯巽小畜家人益无妄夬需比噬嗑頥蠱離旅鼎未濟䝉兌困萃咸蹇渙訟同人謙小過歸妹京氏易傳卷下終
