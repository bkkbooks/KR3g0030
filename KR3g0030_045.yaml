body:
  text: 無妄震下乾上無妄乾剛震動二氣運轉天下見雷行正之道剛正陽長物無妄矣內互見艮止於純陽外互見巽順於陽道天行健而動剛正於物物則順也金木配象吉凶明矣與乾為飛伏九四諸候在世初九元士立應上建始乙巳至庚戌積算起庚戌至己酉周而復始火土入乾震五星從位起熒惑牛宿從位降壬午分氣候三十六上金下木二象相衝陰陽升降健而動內見一陽應動剛五行分配吉凶半矣九五適變入文柔陰蕩陽爻歸復位剛柔履次明在外進退吉凶見中虛次降入火雷噬嗑卦
