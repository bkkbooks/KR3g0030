body:
  text: 漸艮下巽上漸陰陽升降復本曰歸魂之象巽下見艮陰長陽消柔道將進與兌為飛伏九三三公居世宗廟為應建始己亥至甲辰積筭起甲辰至癸卯周而復始五星從位起太白柳宿從位降丙申分氣候二十八上木下土風入艮象漸退之象也互體見離主中文明九五傳位得進道明也六二陰柔得位應至尊易云鴻漸于磐飲食衎衎陰陽升降八卦將盡六十八爻陰陽相雜順道進退次于時也少男之位分於八卦終極陽道也陽極則陰生柔道進也降入坤宮八卦
