body:
  text: 歸妹兌下震上歸妹陰復於本悅動於外二氣不交故曰歸妹互見離坎同於未濟適陽從陰剛從外至九四至剛六三悅柔返無其應凶並羊涉卦之終長何吉也與艮為飛伏三公歸魂之世上六宗廟見應建始甲子至己巳積算起己巳至戊辰周而復始水土入震兌五星從位起歲星軫宿從位降丁丑土分氣候三十八雷居澤上剛氣亢盛陰陽不合進退危也吉凶在上六處於動極適變位定時不可易之道也五行考象非合斯義陰陽運動適當何爻或陰或陽或柔或剛升降六位非取一也夫易者象也爻者效也聖人所以仰觀俯察象天地日月星辰草木萬物順之則和逆之則亂夫細不可窮深不可極故揲蓍布爻用之於下筮分六十四卦配三百六十四爻序一萬一千五百二十策定天地萬物之情狀故吉凶之氣順六爻上下次之八九六七之數內外承乘之象故曰兼三才而兩之孔子曰陽三陰四位之正也三者東方之數東方日之所出又圓者徑一而開三也四者西方之數西方日之所入又方者徑一而取四也言日月終天之道故易卦六十四分上下象陰陽也奇耦之數取之於乾坤乾坤者陰陽之根本坎離者陰陽之性命分四營而成易十有八變而成卦卦象定吉凶明得失降五行分四象順則吉逆則凶故曰吉凶悔吝生乎動又曰明得失於四序運機布度其氣轉易主者亦當則天而行與時消息安而不忘亡將以順性命之理極蓍龜之源重三成六能事畢矣分天地乾坤之象益之以甲乙壬癸震巽之象配庚辛坎離之象配戊巳艮兌之象配丙丁八卦分陰陽六位五行光明四通變易立節天地若不變易不能通氣五行迭終四時更廢變動不居周流六虛上下無常剛柔相易不可以為典要惟變所適吉凶共列于位進退明乎機要易之變化六爻不可據以隨時所占周禮太卜一曰連山二曰歸藏三曰周易初為陽二為陰三為陽四為陰五為陽六為陰一三五七九陽之數二四六八十陰之數陰從午陽從子子午分行子左行午右行左右凶吉吉凶之道子午分時立春正月節在寅坎卦初六立秋同用雨水正月中在丑巽卦初六處暑同用驚蟄二月節在子震卦初九白露同用春分二月中在亥兌卦九四春秋分同用清明三月節在戌艮卦六四寒露同用穀雨三月中在酉離卦九四霜降同用立夏四月節在申坎卦六四立冬同用小滿四月中在未巽卦六四小雪同用芒種五月節在午乾宮九四大雪同用夏至五月中在巳兌宮初九冬至同用小暑六月節在辰艮宮初六小寒同用大暑六月中在卯離宮初九大寒同用孔子易云有四易一世二世為地易三世四世為人易五世六世為天易游魂歸魂為鬼易八卦鬼為繫爻財為制爻天地為義爻福德為寶爻同氣為專爻龍德十一月在子在坎卦左行虎刑五月午在離卦右行甲乙庚辛天官申酉地官丙丁壬癸天官亥子地官戊己甲乙天官寅卯地官壬癸戊己天官辰戌地官靜為悔發為貞貞為本悔為末初爻上二爻中三爻下三月之數以成一月初爻三日二爻三日三爻三日名九日餘有一日名曰閏餘初爻十日為上旬二爻十日為中旬三爻十日為下旬三旬三十積旬成月積月成年八八六十四卦分六十四卦配三百八十四爻成萬一千五百二十策定氣候二十四考五行於運命人事天道日月星辰局於指掌吉凶見乎其位繫乎吉凶悔吝生乎動寅中有生火亥中有生木巳中有生金申中有生水丑中有死金戌中有死火未中有死木辰中有死水土兼於中建子陽生建午陰生二氣相衝吉凶明矣積算隨卦起宮乾坤震巽坎離艮兌八卦相蕩二氣陽入陰陰入陽二氣交互不停故曰生生之謂易天地之內無不通也乾起巳坤起亥震起午巽起辰坎起子離起丑艮起寅兌起於六十四卦遇王則吉廢則凶衝則破刑則敗死則危生則榮考其義理其可通乎分三十為中六十為上三十為下總一百二十通陰陽之數也新新不停生生相續故淡泊不失其所確然示人陰陽運行一寒一暑五行互用一吉一凶以通神明之德以類萬物之情故易所以斷天下之理定之以人倫而明王道八卦建五氣立五常法象乾坤順於陰陽以正君臣父子之義故易曰元亨利貞夫作易所以垂教教之所被本被於有無且易者包備有無有吉則有凶有凶則有吉生吉凶之義始於五行終於八卦從無入有見災於星辰也從有入無見象於陰陽也陰陽之義歲月分也歲月既分吉凶定矣故曰八卦成列象在其中矣六爻上下天地陰陽運轉有無之象配乎人事八卦仰觀俯察在乎人隱顯災祥在乎天考天時察人事在乎卦八卦之要始於乾坤通乎萬物故曰易窮則變變則通通則久久於其道其理得矣卜筮非襲於吉唯變所適窮理盡性于茲矣
