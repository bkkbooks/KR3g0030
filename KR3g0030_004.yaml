body:
  text: 否坤下乾上否內象陰長天氣上騰地氣下降二象分離萬物不交也小人道長君子道消易云否之匪人與坤為飛伏三公居世上九宗廟為應君子以俟時小人為災建壬申至丁丑陰氣浸長積算起丁丑至丙子周而復始五星從位起歲星柳宿從位降乙卯氣分氣候三十六陰陽升降陽道消鑠陰氣凝結君臣父子各不逮及易云其亡其亡繫于苞桑天地清濁陰薄陽消天地盈虛與時消息危難之世勢不可久五位既分四時行矣上九云否極則傾何可長也陰長降入於觀
