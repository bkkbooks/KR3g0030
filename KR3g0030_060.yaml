body:
  text: 咸艮下兌上咸山下有澤虛己畜物陽中積陰感於物也陽下於陰男女之道內外相應感類於象也六二待聘九五見召二氣交感夫婦之道體斯合也易曰咸感也利取女吉與艮為飛伏九三三公居世上六宗廟為應建始戊午至癸亥積算起癸亥至壬戌周而復始火土入艮兌五星從位起熒惑柳宿從位降丙申分氣候三十六土上見金母子氣合陰陽相應剛柔定位吉凶隨爻受氣出則吉刑則凶陰陽等降入外險止於內象為山水蹇卦
