body:
  text: 豫坤下震上豫卦配火水木以為陽用事易云利建侯行師又云天地以順動故日月不過四時不忒聖人以順動則刑罰清而民服與坤為飛伏世立元士為地易奉九四為正正建丁丑至壬午積筭起壬午至辛巳以六爻定吉凶周而復始五星從位起熒惑亢宿從位降乙未土上木下見土內順外動故為悅豫時有屯夷事非一揆爻象適時有凶有吉人之生世亦復如斯或逢治世或逢亂時出處存亡其道皆系易云大矣哉陰陽升降分數二十八極大小之數以定吉凶之道豫以陽適陰為內順成卦之義在於九四一爻以陽盪陰君子之道變之於解
