body:
  text: 升巽下坤上升陽升陰而陰道凝盛未可便進漸之曰升升者進也卦雖陰而取象於陽故曰以陽用事與坤為飛伏諸侯在世元士為應侯建庚辰至乙酉積算起乙酉至甲申周而復始五星從位起太陰心宿入位降癸丑土下見木內外俱順動陰陽而長歲時人事配吉凶發乎動易繫云吉凶悔吝生乎動氣候配象數位三十六自下升高以至於極至極而反以修善道而成其體陰道革入陽為坎水與風見井
