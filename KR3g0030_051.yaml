body:
  text: 鼎巽下離上鼎木能巽火故鼎之象亨飪見新供祭明矣易曰鼎取新陰陽得應居中履順三公之義繼於君也陰穴見火順於上也中虛見納受辛於內也金玉之鉉在乎陽饗新亨飪在乎陰與巽為飛伏九二立大夫為世六五居尊見應建始庚戌至乙卯積算起乙卯至甲寅周而復始分土木入離巽五星從位起鎮星奎宿從位降辛亥水分氣候三十六火居木上二氣交合陰陽巽順器具形存金玉堅剛配象陰陽升降六位遞相遷次九三適變以陽入陰見乎坎險降入水火未濟卦
