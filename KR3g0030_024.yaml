body:
  text: 師坎下坤上師變離入陰陽於正道復本歸坎陽在其中矣處下卦之中為陰之主利於行師易云師者衆也衆陰而宗於一一陽得其貞正也與離為飛伏陰陽相薄剛柔遷位世主三公應為宗廟建始壬辰至丁酉積算起丁酉至丙申周而復始五星從位起歲星婁宿從位降戊午分氣候二十八地下有水復本位六五居陰處陽位九二貞正能為衆之主不潰於衆易云師貞丈人吉入卦始於坎陰陽相蕩反至於極則歸本坎中男升降得失吉凶悔吝策於六爻六爻之設出於蓍蓍之得象而卦生積算起於五行五行正則吉極則凶吉凶之象顯於天地人事日月歲時坎之變於艮艮為少男少男處卦之末為極也次入艮卦
