body:
  text: 解坎下震上解陰陽積氣聚散以時內險外動必散易云解者散也解也品彙甲拆雷雨交作積氣運動天地剖判成卦之義在於九二與坎為飛伏立大夫於世為人而六五降應委權命於庶品建戊寅至癸未推吉凶於陰陽定運數於歲時積算起癸未至壬午周而復始五星從位起鎮星氏宿從位降戊辰木下見水動而險陰陽會散萬物通焉升降屬陽蕩陰以陽為尊尊者高而卑者低變六三為九三恆卦分氣候定數極位於三十六變坎入巽居內象為雷風運動鼓吹萬物謂之恆
