body:
  text: 小畜乾下巽上小畜易云密雲不雨自我西郊小畜之義在於六四三陽連進於一危也外巽體陰畜道行也巽之初六陰蕩陽氣感積陰不能固退復本位三連同往而不可見成於畜義外象明矣易云既雨既處也與乾為飛伏初九元士居世六四諸侯在應建始壬寅至丁未積算起丁未至丙午周而復始木土入乾巽五星從位起太白尾宿從位降甲子分氣候其數二十八一陰居六四建子入陽宮推其休咎處吉凶剛健立陽爻陰凝在巽體易云輿說輹夫妻反目夏至起純陰陽爻位伏藏冬至陽爻動陰氣凝地陰陽升降以柔為剛見中虛文明積氣居內象次降入風火家人卦
