body:
  text: 益震下巽上益天地不交曰否六二陰上柔剛九四下降積陰故為益易曰損上益下雷動風行男下女上陽益陰君益於民之仰也互見坤坤道柔順又外見艮艮止陽益陰止於陽柔道行也與震為飛伏六三三公居世上九宗廟為應建始甲辰至己酉積算起己酉至戊申周而復始土金入震巽五星從位起歲星計宿從位降庚辰分氣候二十八陰陽二木合金土配象四時運轉六位交分休廢旺生吉凶見乎動爻配日月星辰進退運氣升降復當何位適變於外陰入陽爻二象健而動屬於天地也陰陽相蕩次降入天雷無妄卦
