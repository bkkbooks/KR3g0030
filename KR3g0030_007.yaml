body:
  text: 晉坤下離上晉陰陽返復進退不居精粹氣純是為游魂金方以火土運用事與艮為飛伏諸侯居世反應元士建己卯至甲申陰陽繼候積筭起甲申金至癸未土周而復始五星從位起太白翼宿從位降己酉金二象分候二十八運配金土積筭氣候無差於晷刻吉凶列陳象在其中矣天地運轉氣在其中矣乾道變化萬物通矣六爻交通至於六卦陰陽相資相返相剋相生至游魂復歸本位為大有故曰火在天上大有為歸魂卦定吉凶配人事五行象乾為指歸地
