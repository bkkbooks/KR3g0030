body:
  text: 震震下震上震分陰陽交互用事屬於木德取象為雷出自東方震有聲故曰雷雷能警於萬物為發生之始故取東也為動之主為生之本易繫云帝出乎震與巽為飛伏宗廟處上六運數入丙子至辛巳積算起辛巳至庚辰土宮配吉凶周而復始五星從位起歲星角宿從位降庚戌土內外木土二象俱震易曰震驚百里又云畏鄰戒也取象為陽配爻屬陰故曰陰陽交錯而為震氣候分數三十六定吉凶於頃刻毫釐之末無不通也無不備也陰陽交互陽為陰陰為陽陰陽二氣蕩而為象故初九三陰為豫
