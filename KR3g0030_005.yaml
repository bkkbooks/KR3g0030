body:
  text: 觀坤下巽上觀內象陰道已成威權在臣雖大觀在上而陰道浸長與巽為飛伏諸侯臨世反應元士而奉九五易云觀國之光利用賓于王建癸酉至戊寅陰陽交伏積算起戊寅至丁丑周而復始金土火互為體五星從位起熒惑星宿從位降辛未土木分氣二十八陰陽升降定吉凶成敗取六四至于九五成卦之終也易云觀我生又云風行地上列象分爻以定陰陽進退之道吉凶見矣地上見巽積陰凝盛降入于剝
