body:
  text: 節兌下坎上節水居澤上澤能積水陽止於陰故為節節者止也陽蕩陰而積實居中悅內而險於前陰陽進退金水交運與兌為飛伏元士立元首見應諸侯建起甲申至己丑積算起己丑至戊子周而復始五星從位起太陰女宿從位降丁巳金上見水本位相資二氣交爭失節則嗟易云不節若則嗟若分氣候二十八中男入兌少女分蕩入陰中位見陽升降見長男次入水雷屯
