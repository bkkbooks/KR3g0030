body:
  text: 噬嗑震下離上噬嗑柔乘文剛積氣居中陰道明白動見文明雷電合分威光而噬嗑也易曰頤中有物曰噬嗑陰陽分中動而明物有不齊齧而噬吉凶之道象於五行順則吉逆則凶火木合卦配升降與離為飛伏六五居尊應六二大夫建始丙午至辛亥積算起辛亥至庚戌周而復始火土入離震五星從位起鎮星女宿從位降己未土分氣候二十八火居水上陽中見陰陽雜氣渾而溷吉凶適變隨時見也返復陰游魂入卦五行進退始終之道斯可驗矣升降六爻極返終下降山雷頤卦
