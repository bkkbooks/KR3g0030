body:
  text: 頤震下艮上頤六位上下周而復始內外交互降入純陰地之氣萃在其中積純和之氣見浩然之道明矣土木配象吉凶從六虛與震為飛伏六四諸侯在世元士之初九見應建始辛亥至丙辰積算起丙辰至乙卯周而復始土木入艮震五星從位起太白虛宿從位降丙戌土分氣候三十六山下有雷止而動陰陽通變分氣候內外剛而積中柔升降遊魂下居六四位特分復歸於本吉凶起於六四次環六位星宿躔次也極則反本降入歸魂山風蠱卦
