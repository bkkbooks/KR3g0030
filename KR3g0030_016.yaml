body:
  text: 隨震下兌上隨震象復本曰隨內象見震曰本純木用事與巽為飛伏世立三公應宗廟建乙酉至庚寅積筭起庚寅至己丑周而復始五星從位起鎮星計都從位降庚辰氣候分數二十八六位雖殊吉凶象震進退隨時各處其位無差晷刻內外二象悅而動隨附於物係失在於六爻吉凶定於起筭之端進退見乎隨時之義金木交刑水火相敵休廢於時吉凶生焉震以一君二民動得其宜本於乾而生乎震故曰長男陰陽升降為八卦至隨為定體資於始而成乎終坎降中男而曰坎互陽爻居中為坎卦
