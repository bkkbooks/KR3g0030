body:
  text: 中孚兌下巽上中孚陰陽變動六位周匝反及遊魂之卦互體見民止於信義與乾為飛伏艮道革變升降各稟正性六四諸侯立世應初九元士九五履信九二反應氣候相合內外相敵建始庚子至乙巳積算起乙巳至甲辰周而復始五星從位起鎮星鬼宿從位降辛未分氣候三十六風與澤二氣相合巽而説信及於物物亦順焉易云信及豚魚兌入艮六三入陽內二陽歸陰陰陽交互復本曰歸魂次降歸魂風山漸卦
