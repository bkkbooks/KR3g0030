body:
  text: 小過艮下震上小過六四適變血脈通也陽入陰陰入陽二氣降內外象上下返應二剛相適土木入卦分於二象雷處高山亢之極也內柔無正性危及於外易曰飛鳥遺之音不宜上宜下與坤為飛伏反歸九四諸侯立世元士見應建始乙丑至庚午積算起庚午至己巳周而復始土火入震艮五星從位起太陰翼宿從位降庚午分氣候三十六木下見土二陽畜陰六位相刑吉位生也上升下陰陽反應各私其黨六爻適變陰道悖也升降進退其道同也之艮入兌陰納與陽也反復其位次降入歸魂雷澤歸妹卦
