body:
  text: 損兌下艮上損澤在山下卑險於山山高處上損澤益山成高之義在於六三在臣之道奉君立誠易云損下益上與兌為飛伏三公居世宗廟建始癸巳至戊戌積筭起戊戌至丁酉周而復始五星從位起太陰觜宿從位降丁丑土星入卦配吉凶陰陽相盪位不居六爻有吉凶四時變更不可執一以為規分氣候二十八陰陽升降次艮入離見睽之象損益六爻剛長陰次入火澤睽卦
