body:
  text: 蠱巽下艮上蠱適六爻陰陽上下本道存也氣運周而復始山下見風止而順內互悅而動易云蠱者事也先甲後甲事分而令行金土合木象復本曰歸魂與震為飛伏九三歸魂立三公在世應上九見宗廟建始庚戌至乙卯積算起乙卯至庚寅周而復始土木入艮巽五星從位起太陰危宿從位降辛酉金分氣候二十八木上見土風落山貞幹於父事陰陽復位長幼分焉八卦循環始於巽歸魂內象見還元六爻進退吉凶在於四時積算起宮從乎建始升陰陽巽宮適變入離文柔分矣陰入陽退見中虛次水中女八卦相蕩陰陽定位遷入離宮八卦純火以日用事
