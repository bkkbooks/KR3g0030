body:
  text: 睽兌下離上睽火澤二象氣運非合陰消陽長取象何比惟陽是從陰陽動靜剛柔分焉先睽後合其消通也文明上照幽暗分矣易云見豕負塗載鬼一車先張之弧後説之弧遇雨則吉群疑亡也與離為飛伏諸侯立九四為世初元世為應建始甲午至己亥積算起己亥至戊戌五星從位起歲星參宿從位降己酉分氣候三十六金火二運合土宮配吉凶於歲時六五陰柔處文明九二四得立權臣陰陽相蕩六位逆遷變離入乾健於外象坎入履次降入天澤履卦
