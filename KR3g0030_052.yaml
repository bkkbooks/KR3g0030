body:
  text: 未濟坎下離上未濟陰陽二位各復本體六爻交互異於正象故取未濟名之世應得位陰陽殊塗性命不交吉凶列矣與坎為飛伏六三三公為世應宗廟建始辛亥至丙辰積算起丙辰至丁卯水土二象入離坎五星從位起太白婁宿從位降戊午火分氣候二十八水火二象坎離相納受性本異立位見隔睽于上下吉凶生也受刑見害氣不合也陰陽升降入於外卦適離為艮上著於象天地盈虛與時消息其大也次降入山水蒙卦
