body:
  text: 離離下離上離本於純陽陰氣貫中稟於剛健見乎文明故易曰君子以繼明照于四方陽為陰主陽伏於陰也是以體離為日為火始於陽象而假以陰氣純用剛健不能明照故以陰氣入陽柔於剛健而能順柔中虛見火象也與坎為飛伏宗廟為世應上見三公建始戊申至癸丑積筭起癸丑至壬子周而復始土水二象入離火位五星從位起歲星室宿從位降己巳火分氣候三十六內外二象配於火土為祥互見悅順著於明兩陰陽升降入初九適變從陰止於艮象吉凶從位起至六五休廢在何爻次降入火山旅卦
