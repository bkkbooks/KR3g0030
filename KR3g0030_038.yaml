body:
  text: 夬乾下兌上夬剛決柔陰道滅五陽務下一陰危上將反游魂九四悔也澤上於天君道行也與兌為飛伏九五立世九二大夫為應建始己亥至甲辰積算起甲辰至癸卯周而復始金木分乾兌入坤象五星從位起太陰亢宿從位降丁酉分氣候二十八易云澤上於天夬揚于王庭柔道消消不可極反於游魂九四柔來文剛陰道存也陰之道不可終否剛柔相濟日月明矣天地定位人事通也故曰雷動風行山澤通氣人之運動體斯合矣陰陽升降反復道也次降入游魂水天需卦
