body:
  text: 謙艮下坤上謙六位謙順四象無凶一陽居內卦之上為謙之主易曰謙謙君子利涉大川陰陽不爭處位謙柔陰中見陽止順於謙有無之位上下皆通易曰撝謙無不順也與坤為飛伏六位居世大夫在應建始庚申至乙丑積算起乙丑至甲子周而復始金土入坤艮五星從位起太白張宿從位降癸亥分氣候二十八坤在艮上順而止五行入位象謙柔陰陽升降至六五位返入游魂變歸六四八卦相離四象分也次降入雷山小過卦
