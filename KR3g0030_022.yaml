body:
  text: 豐離下震上豐雷火交動剛柔散氣積則暗動乃明易云豐其屋蔀其家窺其戶闃其無人三歲不覿乃凶火木分象配於積陰與震為飛伏陰處至尊為世大夫見應君臣相暗世則可知臣強君弱為亂世之始建生戊子至癸巳雷與火震動曰豐宜日中夏至積陰生豐當正應吉凶見矣積算起癸巳至壬辰周而復始五星從位起太白壁宿從位降庚申分氣候二十八上木下火氣稟純陽陰生於內陽氣雜正性潰亂極乃反為游魂入積陰陰陽升降反歸於本變體於有無吉凶之兆或見於有或見於無陰陽之體不可執一為定象於八卦陽蕩陰陰蕩陽二氣相感而成體或隱或顯故係云一陰一陽之謂道外卦震降陰入明夷
