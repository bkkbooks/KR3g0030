body:
  text: 臨兌下坤上臨陽長陰消悅而順金土應候剛柔分震入兌二陽剛本體陰柔降入臨臨者天也陽爻健順陽交退散易曰君子之道易云至于八月凶陽長六爻反復吉凶之道可見矣與兌為飛伏九二大夫立世六五至尊應上位建始丙申至辛丑七月積氣至六月吉凶隨爻考汙隆積算起辛丑至庚子五星從位起熒惑翼宿從位在丁卯分氣候三十六坤下見兌悅澤臨陽升陰降入三陽乾象入坤即泰卦外坤積陰內兌亦為陰二陽合體柔順之道不可貞吉凶以時配於六位用於陽長之爻成臨之義六三將變陽爻至次降入泰卦
