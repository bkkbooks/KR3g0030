body:
  text: 渙坎下巽上渙水上見木渙然而合內外健而順納實居中正互見動而上陰陽二象資而益也風行水上處險非溺也九五履正思順非逼也與巽為飛伏九五居尊大夫應建始癸丑至戊午積算起戊午至丁巳周而復始火土入坎巽五星從位起歲星昴宿從位降辛巳火分氣候其數二十八內卦坎中滿一陽居中積實于內風在外行虛聲外順吉凶之位考乎四序盛衰之道在乎機要陰陽死于位生于時死于時生于位進退不可詰正盛則衰來正衰則盛來易曰積善之家必有餘慶積不善之家必有餘殃八卦始終六虛反復游魂生巽入乾為天水訟卦
