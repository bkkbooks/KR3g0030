body:
  text: 困坎下兌上困澤入坎險水不通困外稟內剛陰道長也陰陽不順吉凶生也易云困于石據于蒺藜入于其宮不見其妻凶上下不應陰陽不交二氣不合五行配六位生悔吝四時休王金木交爭萬物之情在乎幾微與坎為飛伏初六元士為世九四諸侯在應建始丙辰至辛酉積筭起辛酉至庚申周而復始土金入坎兌五星從位起太陰井宿從位起太陰降戊寅分氣候其數二十八坎象互見離火入兌金水見運配吉凶陰陽升降坎入坤陰氣凝盛降入萃
