body:
  text: 履兌下乾上履天下有澤曰履得位吉失位凶素尚吉易云視履考祥其旋元吉與乾為飛伏六丙屬八卦九五得位為世身九二大夫合應象建始乙未至庚子積算起庚子至乙亥五星從位起熒惑井宿從位降壬申分氣候金火入卦起於極數二十八陽多陰少宗少為貴得其所履則貴失其所履則賤易云眇能視跛能履吉凶取此文為準六位推遷積欠起算數休王相破資益可定吉凶也升降反位歸復止於六四入陰為遊魂中孚卦
