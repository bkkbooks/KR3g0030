body:
  text: 旅艮下離上旅陰中見陽蕩入陽中陰陽二氣交互見本象火居山上為旅之義易曰旅人先笑後號咷又曰得其資斧仲尼為旅人固可知矣與艮為飛伏其居初六元士九四諸侯見應建始己酉至甲寅積算起甲寅至癸丑周而復始金入木土離艮五星從位起熒惑壁宿從位降丙辰分氣候三十六火土同宮二氣合應陰陽相對吉凶分乎陰位上九陽居宗廟得喪于易六五為卦之主不係于一凶其宜也內象適變蕩陰入陽巽順於物進退意器外象明應內為鼎次降火從風入鼎
