body:
  text: 恆巽下震上恆久於其道立於天地雷與風行陰陽相得尊卑定矣號令發而萬物生焉雷風行而四方齊也與巽為飛伏三公治世應於上六宗廟建己卯至甲申金木起度數積筭起甲申至癸未周而復始五星從位起太白房宿從位降辛酉上下二象見木分陰陽於內外氣候分數三十八九三至於陽屯之位不順所履無定其位易云不恆其德或承之羞陰陽升降反於陰君道漸進臣下爭權運及於升
