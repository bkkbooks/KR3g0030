body:
  text: 艮艮下艮上艮乾分三陽為長中少至艮為少男本體屬陽陽極則止反生陰象易云艮止也於人為手為背取象為山為石為門為狗上艮下艮二象土木分氣候與兌為飛伏世上見宗廟三公為應陰陽遷次長幼分形庚寅至乙未陰長陽極升降六位進退順時消息盈虛積筭起庚寅至己丑周而復始五星從位起熒惑胃宿從位降丙寅分數位三十六金木相敵升降以時艮止於物背於物易云時止則止時行則行剛極陽反陰長積氣止於九三初六變陽取其虛中文明在內成於賁次降入賁卦
