body:
  text: 大壯乾下震上大壯內外二象動而健陽勝陰而為壯易曰羝羊觸藩羸其角進退難也壯不可極極則敗物不可極極則反故曰君子用罔小人用壯與震為飛伏九四諸侯之世初九元士在應建始戊戌至癸卯積算起癸卯至壬寅五星從位起太白角宿從位降庚午分氣候三十六雷在天上健而動陽升陰降陽來蕩陰吉凶隨爻著于四時九四庚午火之位入坤為卦之本起于子滅于寅陰陽進退六位不居周流六虛外象震入兌為陰悅適爻為剛長次降入夬陽決陰之象入澤天夬卦
